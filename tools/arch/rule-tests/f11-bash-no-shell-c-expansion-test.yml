id: F11-bash-no-shell-c-expansion
valid:
  - "deno eval 'console.log(1)'"
  - "perl -E 'say 1'"
  - "xargs -I % sh -c 'printf \"%s\\n\" \"$1\"' _ %"
  - "bash -c 'echo hi'"
  - "bash -c 'run \"$1\"' _ \"$value\""
  - 'bash "$script" "$arg"'
  - 'bash -n "$file"'
  - 'echo "bash -c $x"'
  - "sh -c 'exit 0'"
  - "python3 -c 'import sys; print(sys.argv[1])' \"$x\""
  - 'node "$script" "$arg"'
  - 'ssh "$host" uptime'
  - 'ssh -o ConnectTimeout=5 "${user}@${host}" "uptime"'
  - "bash <<< 'echo hi'"
  - "bash <<'EOF'\necho hi\nEOF"
  - 'echo "$x" | grep -q foo'
  - 'printf "ok\n" | bash'
  - 'node -p "1 + 1"'
  - "xargs -I{} sh -c 'echo \"$1\"' _ {}"
invalid:
  - 'xargs -I%  sh -c "echo %"'
  - "xargs -I% sh -c 'echo %'"
  - 'deno eval "$x"'
  - 'perl -E"$x"'
  - 'bash -c"$x"'
  - 'xargs -I % bash -c "echo %"'
  - 'bash -c "$handler_cmd"'
  - 'sh -c "echo $y"'
  - 'bash -c $cmd'
  - 'out=$(bash -c "source \"$SCRIPT_DIR/lib.sh\"; f")'
  - 'timeout "$t" bash -c "$command_str"'
  - 'zsh -lc "$cmd"'
  - '/bin/sh -c "$(cat "$f")"'
  - 'bash -ec "${steps[$i]}"'
  - '"$SHELL" -c "$cmd"'
  - 'python3 -c "import json; print(json.load(open(\"$f\")))"'
  - 'node -e "console.log($x)"'
  - 'perl -e "print $x"'
  - 'bash <<< "$cmd"'
  - 'sh <<<"$(cat "$f")"'
  - 'ssh "$host" "cd $dir && shipwright status"'
  - 'echo "$x" | bash'
  - 'printf "%s" "$x" | sh -s'
  - "bash <<EOF\n$cmd\nEOF"
  - '/usr/local/bin/bash -c "$x"'
  - '/opt/homebrew/bin/bash -c "$x"'
  - 'node --eval="$x"'
  - 'node -p "$x"'
  - 'perl -E "say $x"'
  - 'xargs -I{} sh -c "echo {}"'
  - "xargs sh -c 'echo {}'"
