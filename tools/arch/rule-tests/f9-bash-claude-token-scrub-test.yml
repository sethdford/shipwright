id: F9-bash-claude-token-scrub
valid:
  - 'env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN claude -p "$prompt"'
  - 'timeout 300 env -u GH_TOKEN -u GITHUB_TOKEN claude -p "$prompt"'
  - 'env --unset=GH_TOKEN --unset=GITHUB_TOKEN claude -p "$prompt"'
  - 'sw_claude -p "$prompt"'
  - '"$SW_AGENT_EXEC" claude -p "$prompt"'
  - '"$SW_AGENT_EXEC" $TIMEOUT_CMD "$t" claude -p "$p"'
  - 'timeout 300 "$SW_AGENT_EXEC" claude -p "$p"'
  - 'jq -n --argjson claude "$c" "{}"'
  - 'command -v claude >/dev/null'
  - 'which claude'
  - 'info "claude is ready"'
  - 'echo "$CLAUDE_BIN"'
  - 'grep -q claude "$log"'
  - 'chmod +x /usr/local/bin/claude'
  - '[ -x "$CLAUDE_BIN" ]'
  - "bash -c '\"$SW_AGENT_EXEC\" claude -p x'"
  - 'cmd=("$SW_AGENT_EXEC" claude -p "$p")'
  - 'timeout 5 "$SW_AGENT_EXEC" claude -p "$p"'
  - '"$SW_AGENT_EXEC" claude -p "$SW_AGENT_EXEC" claude'
invalid:
  - 'claude -p "$prompt" --model "$m"'
  - 'out=$(claude --print "$p" 2>&1)'
  - 'timeout "$t" claude -p "$p"'
  - '$TIMEOUT_CMD "$CLAUDE_TIMEOUT" claude -p "$p"'
  - 'env -u GH_TOKEN claude -p "$p"'
  - 'nohup claude -p "$p" > "$log" 2>&1 &'
  - 'foo claude -p "$p"'
  - '"$OTHER_EXEC" claude -p "$p"'
  - 'timeout 5 claude -p "$SW_AGENT_EXEC"'
  - 'timeout 5 "$CLAUDE_BIN" -p "$p"'
  - 'command claude -p "$p"'
  - '"claude" -p "$p"'
  - '/usr/local/bin/claude -p "$p"'
  - '"$CLAUDE_BIN" -p "$p"'
  - '${CLAUDE_CMD} -p "$p"'
  - 'claude -p "$p" GH_TOKEN GITHUB_TOKEN'
  - 'time claude -p "$p"'
  - 'x=$(time claude -p "$p")'
  - '$(command -v claude) -p "$p"'
  - '$CLAUDE -p "$p"'
  - '$claude_bin -p "$p"'
  - "bash -c 'claude -p \"$p\"'"
  - 'sh -c "claude -p $p"'
  - "eval 'claude -p x'"
  - '\claude -p "$p"'
  - 'cmd=(claude -p "$p")'
  - 'cmd=("$CLAUDE_BIN" -p "$p")'
  - 'timeout 5 claude -p "$SW_AGENT_EXEC" claude'
  - 'x=$(claude -p "$SW_AGENT_EXEC")'
  - 'timeout 5 "$CLAUDE_BIN" -p "$p"'
