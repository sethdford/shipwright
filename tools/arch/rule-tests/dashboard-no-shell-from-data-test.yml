id: dashboard-no-shell-from-data
valid:
  - 'execSync("git rev-parse --show-toplevel", { encoding: "utf-8" });'
  - 'execSync("nproc");'
  - 'execFileSync("gh", ["issue", "view", String(n)], { timeout: 5000 });'
  - 'spawn("ssh", sshArgv(host, cmd), { stdio: "pipe" });'
  - 'db.exec("PRAGMA journal_mode=WAL;");'
  - 'const m = PATTERN.exec(line);'
  - 'spawn("git", ["status"], { shell: false });'
  - 'execFileSync("bash", ["scripts/sw-doctor.sh"]);'
  - 'Bun.spawn(["git", "log"]);'
  - 'cp.execSync("nproc");'
  - 'import { execFileSync } from "child_process";'
invalid:
  - 'execSync(`gh issue view ${n}`);'
  - 'execSync("gh issue view " + n, { encoding: "utf-8" });'
  - 'execSync(cmd);'
  - 'exec(`kill ${pid}`, cb);'
  - 'spawn("sh", ["-c", c], { shell: true });'
  - 'execFileSync("git", args, { cwd, shell: true });'
  - 'await Bun.$`git log ${ref}`;'
  - 'cp.execSync(cmd);'
  - 'child_process.execSync(`echo ${x}`);'
  - 'import { execSync as run } from "child_process";'
  - 'import { exec as sh } from "node:child_process";'
  - 'spawn("ls", [], { shell: useShell });'
  - 'spawn("ls", [], { shell: "/bin/zsh" });'
  - 'spawnSync("ls", [], { shell: true });'
  - 'spawn("sh", ["-c", c]);'
  - 'execFileSync("bash", ["-c", c], { encoding: "utf-8" });'
  - 'execFile("/bin/sh", ["-lc", c], cb);'
  - 'cp.spawnSync("bash", ["-c", c]);'
  - 'Bun.spawn(["sh", "-c", c]);'
  - 'Bun.spawnSync(["bash", "-c", c]);'
