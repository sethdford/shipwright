id: F10-github-writes-only-in-writer
valid:
  # Reads
  - 'run({ argv: ["gh", "issue", "view", "1", "--json", "title"] });'
  - 'run({ argv: ["gh", "issue", "list", "--label", "x"] });'
  - 'run({ argv: ["gh", "issue", "list", "--state", "closed"] });'
  - 'run({ argv: ["gh", "pr", "list", "--state", "open"] });'
  - 'run({ argv: ["gh", "pr", "view", "1", "--json", "reviews"] });'
  - 'run({ argv: ["gh", "run", "list", "--json", "conclusion"] });'
  - 'run({ argv: ["gh", "run", "view", "1"] });'
  - 'run({ argv: ["gh", "workflow", "list"] });'
  - 'run({ argv: ["gh", "label", "list"] });'
  - 'run({ argv: ["gh", "release", "list"] });'
  - 'run({ argv: ["gh", "repo", "view"] });'
  - 'run({ argv: ["gh", "secret", "list"] });'
  - 'run({ argv: ["gh", "cache", "list"] });'
  - 'run({ argv: ["gh", "api", "user", "--jq", ".login"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "-X", "GET"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "--method", "GET"] });'
  - 'run({ argv: ["gh", "api", "--paginate", "repos/o/r/issues/1/comments"] });'
  # A write verb as a value of another flag is not a method.
  - 'run({ argv: ["gh", "api", "repos/o/r", "--jq", "POST"] });'
  - 'run({ argv: ["gh", "api", "-X", "GET", "repos/o/r", "--jq", "DELETE"] });'
  # Not gh
  - 'run({ argv: ["git", "issue", "create"] });'
  - 'run({ argv: ["git", "push", "--delete"] });'
  - 'const words = ["create", "issue"];'
  - 'const words = ["pr", "view", "create"];'
  - 'const x = ["workflow", "run"];'
invalid:
  # issue and pr verbs
  - 'run({ argv: ["gh", "issue", "create", "--title", t] });'
  - 'run({ argv: ["gh", "issue", "comment", "1", "--body", b] });'
  - 'run({ argv: ["gh", "issue", "edit", "1", "--add-label", "x"] });'
  - 'run({ argv: ["gh", "issue", "close", "1"] });'
  - 'run({ argv: ["gh", "issue", "reopen", "1"] });'
  - 'run({ argv: ["gh", "issue", "lock", "1"] });'
  - 'run({ argv: ["gh", "issue", "pin", "1"] });'
  - 'run({ argv: ["gh", "issue", "unpin", "1"] });'
  - 'run({ argv: ["gh", "issue", "develop", "1"] });'
  - 'run({ argv: ["gh", "issue", "delete", "1"] });'
  - 'run({ argv: ["gh", "issue", "transfer", "1", "o/r"] });'
  - 'run({ argv: ["gh", "pr", "create", "--fill"] });'
  - 'run({ argv: ["gh", "pr", "merge", "1"] });'
  - 'run({ argv: ["gh", "pr", "review", "1", "--approve"] });'
  - 'run({ argv: ["gh", "pr", "comment", "1", "-b", b] });'
  - 'run({ argv: ["gh", "pr", "close", "1"] });'
  - 'run({ argv: ["gh", "pr", "ready", "1"] });'
  # other command groups
  - 'run({ argv: ["gh", "label", "create", "x"] });'
  - 'run({ argv: ["gh", "label", "edit", "x"] });'
  - 'run({ argv: ["gh", "label", "delete", "x"] });'
  - 'run({ argv: ["gh", "label", "clone", "o/r"] });'
  - 'run({ argv: ["gh", "release", "create", "v1"] });'
  - 'run({ argv: ["gh", "release", "edit", "v1"] });'
  - 'run({ argv: ["gh", "release", "delete", "v1"] });'
  - 'run({ argv: ["gh", "release", "upload", "v1", "a.zip"] });'
  - 'run({ argv: ["gh", "workflow", "run", "x.yml"] });'
  - 'run({ argv: ["gh", "workflow", "enable", "x.yml"] });'
  - 'run({ argv: ["gh", "workflow", "disable", "x.yml"] });'
  - 'run({ argv: ["gh", "run", "rerun", "1"] });'
  - 'run({ argv: ["gh", "run", "cancel", "1"] });'
  - 'run({ argv: ["gh", "run", "delete", "1"] });'
  - 'run({ argv: ["gh", "repo", "edit", "--visibility", "public"] });'
  - 'run({ argv: ["gh", "repo", "create", "x"] });'
  - 'run({ argv: ["gh", "repo", "delete", "x"] });'
  - 'run({ argv: ["gh", "repo", "rename", "x"] });'
  - 'run({ argv: ["gh", "repo", "archive", "x"] });'
  - 'run({ argv: ["gh", "secret", "set", "X"] });'
  - 'run({ argv: ["gh", "secret", "delete", "X"] });'
  - 'run({ argv: ["gh", "variable", "set", "X"] });'
  - 'run({ argv: ["gh", "variable", "delete", "X"] });'
  - 'run({ argv: ["gh", "cache", "delete", "--all"] });'
  # position independence, spreads, quote styles
  - 'run({ argv: ["gh", "issue", "-R", repo, "create"] });'
  - 'run({ argv: ["gh", "-R", repo, "pr", "merge", "1"] });'
  - 'run({ argv: ["gh", ...base, "issue", "close", "1"] });'
  - "run({ argv: ['gh', 'issue', 'create'] });"
  - 'run({ argv: [`gh`, `issue`, `create`] });'
  - 'run({ argv: ["gh", `pr`, "merge"] });'
  - 'gh(["issue", "create", "--title", t]);'
  - 'gh(["pr", "merge", "1"]);'
  - 'gh(["label", "create", "x"]);'
  # gh api: method flag followed by a write method, any case
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "-X", "POST"] });'
  - 'run({ argv: ["gh", "api", "--method", "PATCH", "repos/o/r/issues/1"] });'
  - 'run({ argv: ["gh", "api", "-X", "DELETE", "repos/o/r/labels/x"] });'
  - 'run({ argv: ["gh", "api", "--method=PUT", "repos/o/r/x"] });'
  - 'run({ argv: ["gh", "api", "-XPOST", "repos/o/r/x"] });'
  - 'run({ argv: ["gh", "api", "-X", "post", "repos/o/r/x"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/x", "--method", "Delete"] });'
  # gh api: request bodies
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "-f", "title=x"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "-F", "n=1"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "--field", "n=1"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "--raw-field", "n=1"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "--input", "-"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "--field=n=1"] });'
  - 'run({ argv: ["gh", "api", "repos/o/r/issues", "-ftitle=x"] });'
  # gh api graphql mutation
  - 'run({ argv: ["gh", "api", "graphql", "-q", "mutation { addStar(input: {}) { clientMutationId } }"] });'
