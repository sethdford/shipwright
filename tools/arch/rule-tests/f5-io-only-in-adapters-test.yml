id: F5-io-only-in-adapters
valid:
  - 'import type { Subprocess } from "bun";'
  - 'import type { Stats } from "node:fs";'
  - 'export type { Stats } from "node:fs";'
  - 'let p: Bun.Subprocess;'
  - 'type Spawn = typeof Bun.spawn;'
  - 'import { join } from "node:path";'
  - 'const x = myProcess.env;'
  - 'const b = notBun.spawn(["ls"]);'
invalid:
  # Bun runtime APIs, any member
  - 'Bun.spawn(["ls"]);'
  - 'Bun.spawnSync(["ls"]);'
  - 'await Bun.$`ls`;'
  - 'Bun.file("x");'
  - 'await Bun.write("x", "y");'
  - 'Bun.serve({ fetch() {} });'
  - 'Bun.connect({});'
  - 'Bun.listen({});'
  - 'const e = Bun.env;'
  - 'const s = Bun.stdin;'
  - 'const run = Bun.spawn;'
  - 'globalThis.Bun.spawn(["ls"]);'
  - 'const { spawn } = Bun;'
  - 'let { $ } = Bun;'
  - 'var { file } = Bun;'
  # "bun" module value imports
  - 'import { spawn } from "bun";'
  - 'import { $ } from "bun";'
  - 'import * as bun from "bun";'
  - 'export { spawn } from "bun";'
  - 'const bun = require("bun");'
  - 'const bun = await import("bun");'
  # process
  - 'const e = process.env;'
  - 'const e = process["env"];'
  - "const e = process['env'];"
  - 'const { env } = process;'
  - 'const p = globalThis.process;'
  - 'import process from "process";'
  - 'import { env } from "node:process";'
  - 'import { env } from "process";'
  - 'const p = require("node:process");'
  - 'const p = await import("process");'
  # fetch, filesystem, network, child processes
  - 'await fetch("https://x");'
  - 'await globalThis.fetch("https://x");'
  - 'import { readFileSync } from "node:fs";'
  - 'import { readFile } from "fs/promises";'
  - 'import { Database } from "bun:sqlite";'
  - 'import { spawn } from "child_process";'
  - 'const fs = require("fs");'
  - 'const fs = await import("node:fs");'
  - 'import fs = require("fs");'
  - 'export * from "node:fs";'
