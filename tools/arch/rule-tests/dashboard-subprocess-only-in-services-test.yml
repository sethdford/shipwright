id: dashboard-subprocess-only-in-services
valid:
  - 'import type { Module } from "node:module";'
  - 'const label = globalThis["location"];'
  - 'db.exec("PRAGMA journal_mode=WAL;");'
  - 'const r = regex.exec(line);'
  - 'import { join } from "path";'
  - 'import type { ExecFileSyncOptions } from "child_process";'
  - 'const out = await runGh(["issue", "view", String(n)]);'
  - 'particles.spawn(x, y);'
  - 'const v = Bun.version;'
  - 'type S = typeof Bun.spawn;'
  - 'import type { Subprocess } from "bun";'
  - 'const cfg = Bun.env.HOME;'
invalid:
  - 'import * as nm from "node:module"; const req = nm.createRequire(import.meta.url); req("child_process");'
  - 'import module from "node:module"; module.createRequire(import.meta.url);'
  - 'const S = globalThis["Bun"]; S.spawn(["git"]);'
  - 'const m = require("module");'
  - 'import { execSync } from "child_process";'
  - 'import { spawn } from "node:child_process";'
  - 'const cp = require("child_process");'
  - 'const cp = await import("node:child_process");'
  - 'execSync("nproc");'
  - 'execFileSync("gh", ["issue", "view", String(n)]);'
  - 'const p = spawn("ssh", argv);'
  - 'Bun.spawn(["git", "status"]);'
  - 'await Bun.$`git log`;'
  - 'const { spawn } = Bun;'
  - 'const { spawnSync: run } = Bun;'
  - 'Bun["spawn"](["git", "status"]);'
  - "const run = Bun['spawnSync'];"
  - 'const B = Bun; B.spawn(["git"]);'
  - 'const r = Reflect.get(Bun, "spawn");'
  - 'globalThis.Bun.spawn(["git"]);'
  - 'import { $ as sh } from "bun";'
  - 'import * as B from "bun";'
  - 'import { createRequire } from "node:module";'
  - 'const req = createRequire(import.meta.url); req("child_process");'
  - 'const cp = require("child_" + "process");'
  - 'const m = await import(name);'
