id: F11-bash-no-grep-q-in-pipe
valid:
  - 'echo "$out" | grep >/dev/null -i "stuck"'
  - 'grep -q "x" "$file"'
  - 'grep -qi "x" <<<"$out"'
  - 'cmd | grep -c "x"'
  - 'cmd | grep "x" > "$log"'
  - 'cmd | grep -e -q "$log"'
  - 'cmd | grep -E -f -q'
  - 'a || grep -q x "$file"'
  - 'cmd | command grep -c x'
invalid:
  - 'echo "$out" | grep -q "stuck"'
  - 'echo "$out" | grep -qi "stuck"'
  - 'cmd | grep -qE "a|b"'
  - 'cmd | grep -q -E "a|b"'
  - 'cmd | egrep -q "x"'
  - 'a | b | grep -qs "x"'
  - 'if echo "$x" | grep -qi y; then :; fi'
  - 'cmd | grep --quiet x'
  - 'cmd | grep --silent x'
  - 'cmd | command grep -q x'
  - 'cmd | /usr/bin/grep -q x'
  - 'cmd | sudo grep -qi x'
  - 'cmd |& grep -q x'
  - "cmd \\\n  | grep -q x"
  - 'cmd | grep -qm1 x'
