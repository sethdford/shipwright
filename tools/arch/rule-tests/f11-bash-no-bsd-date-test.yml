id: F11-bash-no-bsd-date
valid:
  - 'date +%s'
  - 'date -u +%Y-%m-%dT%H:%M:%SZ'
  - 'date -u -d "@$e" +"%Y-%m-%dT%H:%M:%SZ"'
  - 'date -d "$ts" +%s'
  - 'date -u -v-7d +%Y-%m-%d'
  - 'date_to_epoch "$ts"'
  - 'epoch_to_iso "$e"'
  - 'echo "date -j -f"'
  - 'date --version'
  - 'date +%j'
  - 'date -u +%s -- "-r"'
  - 'x=$(date -d "$(date -u +%Y)" +%s)'
invalid:
  - 'date -j -f "%Y-%m-%dT%H:%M:%SZ" "$ts" +%s'
  - 'TZ=UTC date -j -f "%Y-%m-%dT%H:%M:%SZ" "$ts" +%s'
  - 'date -u -jf "%Y-%m-%dT%H:%M:%SZ" "$ts" +%s'
  - 'date -u -j -f "%Y-%m-%d" "$ts" +%s'
  - 'x=$(date -j -f "%Y" "$ts" +%s)'
  - 'date -r "$epoch" +%Y-%m-%d'
  - 'date -u -r 1700000000 +%s'
  - 'date -ur "$epoch" +%s'
  - 'command date -r "$epoch"'
  - 'xargs -I{} date -j -f "%Y-%m-%dT%H:%M:%SZ" {} +%s'
