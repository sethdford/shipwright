id: F5-io-only-in-adapters
language: TypeScript
severity: error
message: "I/O belongs in src/adapters. Define a port in the context and inject an adapter from main.ts."
files:
  - "src/**/*.ts"
ignores:
  - "src/adapters/**"
  - "src/testing/**"
  - "src/main.ts"
  - "src/cli.ts"
  - "src/**/*.test.ts"
rule:
  any:
    - pattern: Bun.spawn($$$)
    - pattern: Bun.spawnSync($$$)
    - pattern: Bun.$`$$$`
    - pattern: Bun.file($$$)
    - pattern: Bun.write($$$)
    - pattern: Bun.serve($$$)
    - pattern: Bun.connect($$$)
    - pattern: Bun.listen($$$)
    - pattern: Bun.env
    - pattern: fetch($$$)
    - pattern: globalThis.fetch($$$)
    - pattern: process.env
    - pattern: process["env"]
    - pattern: process['env']
    - pattern: const { $$$ } = process
    - pattern: let { $$$ } = process
    - pattern: var { $$$ } = process
    - all:
        - any:
            - pattern: import($S)
            - pattern: require($S)
        - has:
            field: arguments
            kind: arguments
            has:
              kind: string
              regex: '^["''](bun:sqlite|(node:)?(fs|fs/promises|child_process|net|http|https|dns|tls|dgram|http2|worker_threads))["'']$'
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            kind: string
            regex: '^["''](bun:sqlite|(node:)?(fs|fs/promises|child_process|net|http|https|dns|tls|dgram|http2|worker_threads))["'']$'
        - not:
            regex: '^(import|export)\s+type\s'
    - kind: import_require_clause
      has:
        field: source
        kind: string
        regex: '^["''](bun:sqlite|(node:)?(fs|fs/promises|child_process|net|http|https|dns|tls|dgram|http2|worker_threads))["'']$'
