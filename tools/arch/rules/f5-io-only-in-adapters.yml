id: F5-io-only-in-adapters
language: TypeScript
severity: error
message: "I/O belongs in src/adapters. Define a port in the context and inject an adapter from main.ts."
files:
  - "src/**/*.ts"
ignores:
  - "src/adapters/**"
  - "src/testing/**"
  - "src/main.ts"
  - "src/cli.ts"
  - "src/**/*.test.ts"
rule:
  any:
    - pattern: Bun.spawn($$$)
    - pattern: Bun.$`$$$`
    - pattern: fetch($$$)
    - pattern: process.env
    - pattern: Bun.file($$$)
    - pattern: Bun.write($$$)
    - pattern: Bun.serve($$$)
    - all:
        - any:
            - pattern: import($S)
            - pattern: require($S)
        - has:
            field: arguments
            kind: arguments
            has:
              kind: string
              regex: '^["''](node:)?(fs|fs/promises|child_process|net|http|https)["'']$'
    - kind: import_statement
      has:
        field: source
        kind: string
        regex: '^["''](node:)?(fs|fs/promises|child_process|net|http|https)["'']$'
