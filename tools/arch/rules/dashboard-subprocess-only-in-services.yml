# Dashboard (F12): only allowlisted services spawn processes, so validation and argv building live
# in one place (#8534). Ratcheted (tools/arch/ast-scan.ts): server.ts still spawns directly and may
# only lose call sites until Wave 3 ports it. To add a subprocess call, put it in a service that
# validates its inputs and add that file to `ignores` here and in tools/arch/meta.test.ts (PINNED),
# a change CODEOWNERS review.
# Also caught: aliasing Bun (`const B = Bun`, `Reflect.get(Bun, "spawn")`, `globalThis.Bun.spawn`,
# `globalThis["Bun"]`), `import { $ as sh } from "bun"` and `import * as B from "bun"`, node:module
# (any import or require of it: createRequire loads child_process past every other check, and
# `nm.createRequire(…)` or `module.createRequire(…)` are member forms), and require()/import() of a
# computed specifier. A string built by concatenation is caught by the computed-specifier check.
id: dashboard-subprocess-only-in-services
language: TypeScript
severity: off
metadata: { ratchet: true, owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
message: "Dashboard: spawn processes only from an allowlisted service (dashboard/services/claims.ts). Move the call into a service that validates its input and passes an argv array, and call that service."
files:
  - "dashboard/**/*.ts"
ignores:
  - "dashboard/**/*.test.ts"
  - "dashboard/src/**"
  - "dashboard/services/claims.ts"
  - "dashboard/services/subprocess-guards.ts"
rule:
  any:
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has: { field: source, regex: '^["''](node:)?child_process["'']$' }
        - not: { regex: '^(import|export)\s+type\s' }
    - all:
        - any:
            - pattern: require($S)
            - pattern: import($S)
        - has:
            field: arguments
            has: { kind: string, regex: '^["''](node:)?child_process["'']$' }
    - kind: call_expression
      has:
        field: function
        kind: identifier
        regex: '^(exec|execSync|execFile|execFileSync|spawn|spawnSync|fork)$'
    # Bun.spawn, Bun.$, Bun["spawn"], globalThis.Bun.spawn, and destructuring them out of Bun
    - kind: member_expression
      all:
        - has: { field: object, regex: '^(globalThis\.)?Bun$' }
        - has: { field: property, regex: '^(spawn|spawnSync|\$)$' }
        - not: { inside: { kind: type_query, stopBy: end } }
    - kind: subscript_expression
      all:
        - has: { field: object, regex: '^(globalThis\.)?Bun$' }
        - has: { field: index, regex: '^["''](spawn|spawnSync|\$)["'']$' }
        - not: { inside: { kind: type_query, stopBy: end } }
    - kind: variable_declarator
      all:
        - has: { field: value, regex: '^(globalThis\.)?Bun$' }
        - has: { field: name, kind: object_pattern, regex: '\b(spawn|spawnSync|\$)\b' }
    # Bun used as a value (an alias, an argument to Reflect.get or a helper): only member access on it
    # is a runtime Bun call site, so a bare value is flagged. Type positions (typeof Bun) are not.
    - all:
        - kind: identifier
        - regex: '^Bun$'
        - not: { inside: { kind: member_expression, field: object } }
        - not: { inside: { kind: type_query, stopBy: end } }
        - not: { inside: { kind: nested_type_identifier } }
    # Bun by a computed key of a global object: globalThis["Bun"], window["Bun"] (mirrors F5)
    - all:
        - kind: subscript_expression
        - has: { field: object, regex: '^(globalThis|global|window|self)$' }
        - has: { field: index, regex: '^["''`]?Bun["''`]?$' }
    # Importing spawn/$ from bun, or the whole module as a namespace
    - all:
        - kind: import_statement
        - has: { field: source, regex: '^["'']bun["'']$' }
        - any:
            - has: { kind: namespace_import, stopBy: end }
            - has: { kind: import_specifier, stopBy: end, regex: '^(spawn|spawnSync|\$)(\s|$)' }
        - not: { regex: '^import\s+type\s' }
    # node:module in any form: its createRequire loads child_process past the import checks above
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
            - pattern: require($S)
            - pattern: import($S)
        - has: { field: source, regex: '^["'']((node:)?module)["'']$' }
        - not: { regex: '^(import|export)\s+type\s' }
    - all:
        - any:
            - pattern: require($S)
            - pattern: import($S)
        - has: { field: arguments, has: { kind: string, regex: '^["'']((node:)?module)["'']$' } }
    - kind: identifier
      regex: '^createRequire$'
    - kind: member_expression
      has: { field: property, regex: '^createRequire$' }
    # require and import with a computed specifier (a variable, a template or a concatenation)
    - all:
        - any:
            - pattern: require($S)
            - pattern: import($S)
        - not: { has: { field: arguments, has: { nthChild: 1, kind: string } } }
