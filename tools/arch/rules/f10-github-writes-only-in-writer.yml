# F10: every GitHub write is a GithubWriter method in src/adapters/github/gh-github-writer.ts.
#
# Matches an array literal that is a `gh` argv: the first element is "gh" and the subcommand and
# verb appear anywhere after it, so `["gh", "issue", "-R", repo, "create"]` and arrays that spread
# other elements are caught. Single, double and backtick literals are all matched. A `gh api` call
# is a write when it has an adjacent -X/--method + POST|PATCH|PUT|DELETE (so `--jq POST` is not a
# false positive), any field/input flag (-f -F --field --raw-field --input; gh then defaults to
# POST), or a GraphQL mutation. A read-only `gh api graphql -f query=...` is therefore flagged too:
# add a reader to the adapters that does not need -f, or add a writer method.
# A second branch catches helper calls such as `gh(["issue", "create"])` (no leading "gh").
#
# Not covered: Bun `$` shell strings and `sh -c "gh ..."`. F5 already forbids Bun.$ and process
# spawning outside src/adapters, so only adapter code could spell those.
#
# Keep the regex copies in sync: each subcommand group has one entry in `rule` and one in the
# helper branch, and the group/verb lists mirror `gh <group> --help`.
id: F10-github-writes-only-in-writer
language: TypeScript
severity: error
message: "F10: GitHub writes go only through src/adapters/github/gh-github-writer.ts. Add an idempotent method (it takes an IdempotencyKey) to the GithubWriter port and call that."
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
  - "src/**/*.mts"
  - "src/**/*.cts"
ignores:
  - "src/adapters/github/gh-github-writer.ts"
  - "src/adapters/github/gh-github-writer.test.ts"
rule:
  kind: array
  any:
    - all:
        - has: { nthChild: 1, regex: '^["''`]gh["''`]$' }
        - any:
            - all:
                - has: { regex: '^["''`](issue|pr)["''`]$' }
                - has: { regex: '^["''`](create|edit|comment|close|reopen|merge|review|lock|unlock|pin|unpin|develop|delete|transfer|ready|update-branch|revert)["''`]$' }
            - all:
                - has: { regex: '^["''`]label["''`]$' }
                - has: { regex: '^["''`](create|edit|delete|clone)["''`]$' }
            - all:
                - has: { regex: '^["''`]release["''`]$' }
                - has: { regex: '^["''`](create|edit|delete|upload|delete-asset)["''`]$' }
            - all:
                - has: { regex: '^["''`]workflow["''`]$' }
                - has: { regex: '^["''`](run|enable|disable)["''`]$' }
            - all:
                - has: { regex: '^["''`]run["''`]$' }
                - has: { regex: '^["''`](rerun|cancel|delete)["''`]$' }
            - all:
                - has: { regex: '^["''`]repo["''`]$' }
                - has: { regex: '^["''`](edit|create|delete|rename|archive|unarchive|fork|sync)["''`]$' }
            - all:
                - has: { regex: '^["''`](secret|variable)["''`]$' }
                - has: { regex: '^["''`](set|delete|remove)["''`]$' }
            - all:
                - has: { regex: '^["''`]cache["''`]$' }
                - has: { regex: '^["''`]delete["''`]$' }
            - all:
                - has: { regex: '^["''`]api["''`]$' }
                - any:
                    # -X POST, --method patch: the method must directly follow the flag.
                    - has:
                        regex: '^["''`](-X|--method)["''`]$'
                        precedes:
                          regex: '^["''`](?i:POST|PATCH|PUT|DELETE)["''`]$'
                          stopBy: { regex: '[^,\s]' }
                    # -XPOST, -X=POST, --method=PUT
                    - has: { regex: '^["''`](-X=?|--method=)(?i:POST|PATCH|PUT|DELETE)["''`]$' }
                    # Field and input flags make gh send a request body (default method POST).
                    - has: { regex: '^["''`](-[fF].*|--field(=.*)?|--raw-field(=.*)?|--input(=.*)?)["''`]$' }
                    - has: { regex: '(?i)\bmutation\b' }
    - all:
        - has: { nthChild: 1, regex: '^["''`](issue|pr|label)["''`]$' }
        - has:
            nthChild: 2
            regex: '^["''`](create|edit|comment|close|reopen|delete|merge|review|lock|clone|pin|unpin|transfer)["''`]$'
