id: F8-tests-no-real-home
language: TypeScript
severity: error
message: "Tests must use createTestEnv() paths, never the real home directory or environment."
files:
  - "src/**/*.test.ts"
  - "tools/**/*.test.ts"
ignores:
  - "src/testing/test-env.test.ts"
rule:
  any:
    - pattern: homedir()
    - pattern: $OS.homedir()
    - pattern: process.env.HOME
