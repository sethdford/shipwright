id: F8-tests-no-real-home
language: TypeScript
severity: error
message: "F8: Tests must use createTestEnv() paths, never the real home directory or environment."
metadata: { owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
files:
  - "src/**/*.test.ts"
  - "tools/**/*.test.ts"
ignores:
  - "src/testing/test-env.test.ts"
rule:
  any:
    - pattern: homedir()
    - pattern: $OS.homedir()
    - pattern: process.env
    - pattern: process["env"]
    - pattern: process['env']
    - pattern: Bun.env
    - pattern: const { $$$ } = process
