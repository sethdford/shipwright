id: F6-agent-sdk-only-in-adapter
language: TypeScript
severity: error
message: "F6: Use the AgentRunner port. Only src/adapters/agent may import the Claude Agent SDK."
metadata: { owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
files:
  - "src/**/*.ts"
ignores:
  - "src/adapters/agent/**"
rule:
  any:
    - all:
        - kind: import_statement
        - has:
            kind: import_require_clause
            has:
              field: source
              kind: string
              regex: '^["'']@anthropic-ai/claude-agent-sdk(/.*)?["'']$'
    - all:
        - any:
            - kind: import_statement
            - kind: export_statement
        - has:
            field: source
            kind: string
            regex: '^["'']@anthropic-ai/claude-agent-sdk(/.*)?["'']$'
    - all:
        - any:
            - pattern: import($S)
            - pattern: require($S)
        - has:
            field: arguments
            kind: arguments
            has:
              any:
                - kind: string
                  regex: '^["''`]@anthropic-ai/claude-agent-sdk(/.*)?["''`]$'
                - kind: template_string
                  regex: '^["''`]@anthropic-ai/claude-agent-sdk(/.*)?["''`]$'
