# F9 in the agent adapter: every SDK call states its environment and permission mode explicitly, so
# a refactor cannot drop the env allowlist or thread a bypass mode through a variable. The runtime
# twin is assertAgentOptions() in src/adapters/agent/privilege-guard.ts. Only agent-sdk-runner.ts may
# import the SDK's query as a value (F9-sdk-query-single-importer), so this check sees every call.
#
# Known gap (ADR-0008): a variable passed as `options` (`options: sdkOptions`) is not inspected here.
# The runner assigns it, asserts it with assertAgentOptions() and passes the same object; a meta-test
# pins that. assertAgentOptions() is the run-time check on what is actually passed.
id: F9-agent-options-explicit
language: TypeScript
severity: error
message: "F9: call query() with { prompt, options } where options is an object literal with env: built by agentEnv() (never process.env or Bun.env), or a variable that assertAgentOptions() has checked. Give permissionMode as a string literal such as \"dontAsk\"."
metadata: { owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
files:
  - "src/adapters/agent/**/*.ts"
  - "src/adapters/agent/**/*.mts"
  - "src/adapters/agent/**/*.cts"
ignores:
  - "**/*.test.ts"
rule:
  any:
    # query(...) / this.queryFn(...) (also .call/.apply; db.query(...) is not an SDK call) whose first object has no options with an env
    # object literal or an identifier. `query(args)` and `query({ options: {} })` both fail here.
    - kind: call_expression
      all:
        - has: { field: function, regex: '^(this\.)?(query|queryFn)(\.(call|apply))?$' }
        - not:
            has:
              field: arguments
              stopBy: end
              has:
                kind: pair
                all:
                - has: { field: key, regex: '^options$' }
                - has:
                    field: value
                    any:
                      - kind: identifier
                      - kind: object
                        has:
                          kind: pair
                          all:
                            - has: { field: key, regex: '^env$' }
                            # env: must be a literal or a call such as agentEnv(...), never a variable
                            - not: { has: { field: value, kind: identifier } }
    # env taken from the parent process
    - kind: pair
      all:
        - has: { field: key, regex: '^env$' }
        - has: { field: value, regex: '\b(process\.env|process\[|Bun\.env)' }
    # permissionMode from anything but a string literal (optionally `as const`)
    - kind: pair
      all:
        - has: { field: key, regex: '^permissionMode$' }
        - not:
            has:
              field: value
              regex: '^("[A-Za-z]+"|''[A-Za-z]+'')( as const)?$'
    - kind: shorthand_property_identifier
      regex: '^permissionMode$'
