# F9 for bash (error, ADR-0008): a claude process inherits the caller's environment, including GH_TOKEN. Every invocation
# must unset the GitHub tokens in the same command, and the unset must come before the claude word (`claude -p x GH_TOKEN`
# scrubs nothing), or the invocation must run through "$SW_AGENT_EXEC" (scripts/lib/agent-exec.sh), which builds the agent's
# environment from an allowlist. An invocation is: claude by name (bare, quoted, \claude, or behind an absolute path); a
# variable named like claude ($CLAUDE, $CLAUDE_BIN, $claude_bin); $(command -v claude) as a name; claude as any argument of a
# command (a wrapper such as timeout, gtimeout, env, nohup, command, $TIMEOUT_CMD, or an unknown runner such as "$OTHER_EXEC");
# claude or a claude-named variable inside a bash -c / sh -c / eval string; claude as an element of an array (cmd=(claude …)).
# Exempt: the query and logging builtins and helpers (type, which, hash, echo, printf, info, warn, error, success, log, debug,
# emit_event), grep, chmod, test, jq arguments (`jq --argjson claude`), `command -v|-V claude` (`command claude` is an
# invocation), and a claude word whose immediately preceding word is "$SW_AGENT_EXEC" (any command whose name is
# "$SW_AGENT_EXEC" runs everything after it through the allowlist). `timeout 5 claude -p "$SW_AGENT_EXEC" claude` is invalid:
# the first claude is not preceded by "$SW_AGENT_EXEC".
id: F9-bash-claude-token-scrub
language: Bash
severity: error
metadata: { owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
message: "F9: claude must not inherit GitHub tokens. Run it as \"$SW_AGENT_EXEC\" claude … (scripts/lib/agent-exec.sh), or as env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN claude …."
files:
  - "scripts/**/*.sh"
  - "scripts/sw"
  - ".claude/hooks/**/*.sh"
  - "claude-code/hooks/**/*.sh"
  - "completions/**/*.bash"
  - "install.sh"
rule:
  all:
    - any:
        - kind: command
          any:
            - has: { field: name, regex: '^[\\"'']*(.*/)?claude["'']?$' }
            - has: { field: name, regex: '^"?\$\{?((?i:claude)|[A-Za-z_]*(?i:claude)_?(?i:bin|binary|cmd|cli|path|exe))\}?"?$' }
            - has: { field: name, regex: '^"?\$\(\s*(command\s+-[vV]\s+|which\s+|type\s+(-p\s+)?)?["'']?(.*/)?claude["'']?\s*\)"?$' }
            - has: { field: name, regex: '^"?\$\{[^}]*(?i:claude)[^}]*\}"?$' }
            - has: { field: name, regex: '^"?`[^`]*(?i:claude)[^`]*`"?$' }
            - all:
                - any:
                    - has:
                        kind: word
                        regex: '^[\\"'']*(.*/)?claude["'']?$'
                        not: { follows: { regex: '^"?\$\{?SW_AGENT_EXEC\}?"?$', stopBy: neighbor } }
                    - has:
                        regex: '^"?\$\{?((?i:claude)|[A-Za-z_]*(?i:claude)_?(?i:bin|binary|cmd|cli|path|exe))\}?"?$'
                        not: { follows: { regex: '^"?\$\{?SW_AGENT_EXEC\}?"?$', stopBy: neighbor } }
                    - has:
                        regex: '\$\{[^}]*:-["'']?\\?claude["'']?\}'
                        not: { follows: { regex: '^"?\$\{?SW_AGENT_EXEC\}?"?$', stopBy: neighbor } }
                - not:
                    has:
                      field: name
                      regex: '^(type|which|hash|echo|printf|info|warn|error|success|log|debug|emit_event|jq|grep|chmod|test|\[|pgrep|pkill|ln)$'
                - not:
                    has:
                      field: name
                      regex: '^"?\$\{?SW_AGENT_EXEC\}?"?$'
                - not:
                    all:
                      - has: { field: name, regex: '^command$' }
                      - has: { kind: word, regex: '^-[vV]$' }
            - all:
                - has:
                    field: name
                    regex: '^(bash|sh|zsh|dash|ksh|eval|timeout|gtimeout|nohup|sudo|doas|env|nice|exec|command|xargs|time|stdbuf|setsid)$'
                - any:
                    - has:
                        kind: string
                        regex: '(^["'']|[;&|(`]|\$\()[[:space:]]*((timeout|gtimeout|env|nohup|nice|sudo|command|exec|time|stdbuf)[[:space:]]+(-[^[:space:]]+[[:space:]]+)*)?(\\?claude|\$\{?((?i:claude)|[A-Za-z_]*(?i:claude)_?(?i:bin|binary|cmd|cli|path|exe))\}?)([[:space:]"'';|&)]|$)'
                    - has:
                        kind: raw_string
                        regex: '(^["'']|[;&|(`]|\$\()[[:space:]]*((timeout|gtimeout|env|nohup|nice|sudo|command|exec|time|stdbuf)[[:space:]]+(-[^[:space:]]+[[:space:]]+)*)?(\\?claude|\$\{?((?i:claude)|[A-Za-z_]*(?i:claude)_?(?i:bin|binary|cmd|cli|path|exe))\}?)([[:space:]"'';|&)]|$)'
        - kind: array
          any:
            - has:
                kind: word
                regex: '^[\\"'']*(.*/)?claude["'']?$'
                not: { follows: { regex: '^"?\$\{?SW_AGENT_EXEC\}?"?$', stopBy: neighbor } }
            - has:
                regex: '^"?\$\{?((?i:claude)|[A-Za-z_]*(?i:claude)_?(?i:bin|binary|cmd|cli|path|exe))\}?"?$'
                not: { follows: { regex: '^"?\$\{?SW_AGENT_EXEC\}?"?$', stopBy: neighbor } }
    - not:
        all:
          - has:
              kind: word
              regex: '^(--unset=)?GH_TOKEN$'
              precedes: { stopBy: end, regex: '^["'']?(.*/)?claude["'']?$' }
          - has:
              kind: word
              regex: '^(--unset=)?GITHUB_TOKEN$'
              precedes: { stopBy: end, regex: '^["'']?(.*/)?claude["'']?$' }
