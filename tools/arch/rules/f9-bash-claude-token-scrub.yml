# F9 for bash: a claude process inherits the caller's environment, including GH_TOKEN. Every
# invocation must unset the GitHub tokens in the same command, and the unset must come before the
# claude word (`claude -p x GH_TOKEN` scrubs nothing). An invocation is claude by name (bare, quoted,
# or behind an absolute path), by a CLAUDE_BIN/CLAUDE_CMD-style variable, or as the word after a
# wrapper (timeout, gtimeout, env, nohup, command, $TIMEOUT_CMD, $_timeout_cmd …). `command -v claude`,
# `grep claude`, `chmod +x …/bin/claude` and log lines are not invocations. Ratcheted.
id: F9-bash-claude-token-scrub
language: Bash
severity: off
metadata: { ratchet: true, owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
message: "F9: claude must not inherit GitHub tokens. Run it as env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN claude …, or call a helper such as sw_claude() that does exactly that."
files:
  - "scripts/**/*.sh"
  - "scripts/sw"
  - ".claude/hooks/**/*.sh"
  - "claude-code/hooks/**/*.sh"
  - "completions/**/*.bash"
  - "install.sh"
rule:
  kind: command
  all:
    - any:
        - has: { field: name, regex: '^["'']?(.*/)?claude["'']?$' }
        - has: { field: name, regex: '^"?\$\{?[A-Za-z_]*CLAUDE_?(BIN|BINARY|CMD|CLI|PATH|EXE)\}?"?$' }
        - all:
            - has: { field: name, regex: '^(time|g?timeout|env|nohup|exec|nice|stdbuf|sudo|command|xargs|"?\$\{?[A-Za-z_]*(?i:timeout|cmd)[A-Za-z_]*\}?"?)$' }
            - has: { kind: word, regex: '^["'']?(.*/)?claude["'']?$' }
            - not:
                all:
                  - has: { field: name, regex: '^command$' }
                  - has: { kind: word, regex: '^-[vV]$' }
    - not:
        all:
          - has:
              kind: word
              regex: '^(--unset=)?GH_TOKEN$'
              precedes: { stopBy: end, regex: '^["'']?(.*/)?claude["'']?$' }
          - has:
              kind: word
              regex: '^(--unset=)?GITHUB_TOKEN$'
              precedes: { stopBy: end, regex: '^["'']?(.*/)?claude["'']?$' }
