id: dashboard-no-shell-from-data
language: TypeScript
severity: error
message: "Dashboard: run subprocesses with execFileSync/spawn and an argv array. A shell command must be a constant string literal; never build one from data (#8534, spec §3.3 interim rule until the Wave 3 port)."
files:
  - "dashboard/**/*.ts"
ignores:
  - "dashboard/**/*.test.ts"
  - "dashboard/src/**"
utils:
  # A string literal naming a shell: "sh", "bash", "zsh", optionally under /bin or /usr/bin.
  shell-name:
    kind: string
    regex: '^["''](?:/usr)?(?:/bin/)?(?:sh|bash|zsh)["'']$'
  # A string literal shell flag that runs a command string: -c, -lc, -ec, ...
  dash-c:
    kind: string
    regex: '^["'']-[a-z]*c[a-z]*["'']$'
rule:
  any:
    # execSync / exec with anything but a plain string literal as the command. execSync also as a
    # member (cp.execSync); bare exec only, so RegExp#exec and db.exec stay allowed.
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: '^(?:(?:[A-Za-z_$][\w$]*\.)*execSync|exec)$'
        - not:
            has:
              field: arguments
              has:
                nthChild: 1
                kind: string
    # child_process calls with a shell option other than false
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: '^(?:[A-Za-z_$][\w$]*\.)*(?:spawn|spawnSync|execFile|execFileSync|exec|execSync)$'
        - has:
            field: arguments
            has:
              kind: object
              has:
                kind: pair
                all:
                  - has:
                      field: key
                      regex: '^shell$'
                  - not:
                      has:
                        field: value
                        kind: "false"
    # sh/bash -c through an argv array: spawn("sh", ["-c", c]) and friends
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: '^(?:[A-Za-z_$][\w$]*\.)*(?:spawn|spawnSync|execFile|execFileSync)$'
        - has:
            field: arguments
            all:
              - has:
                  nthChild: 1
                  matches: shell-name
              - has:
                  nthChild: 2
                  kind: array
                  has:
                    matches: dash-c
    # Bun.spawn(["sh", "-c", c])
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: '^Bun\.spawn(?:Sync)?$'
        - has:
            field: arguments
            has:
              nthChild: 1
              kind: array
              all:
                - has:
                    nthChild: 1
                    matches: shell-name
                - has:
                    matches: dash-c
    # Aliased child_process imports hide calls from the checks above
    - all:
        - kind: import_specifier
        - has:
            field: alias
            kind: identifier
        - has:
            field: name
            regex: '^(?:exec|execSync|spawn|spawnSync|execFile|execFileSync)$'
    # Bun shell
    - pattern: Bun.$
