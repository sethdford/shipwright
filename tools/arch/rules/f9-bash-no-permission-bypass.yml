# F9 for bash (error, zero baseline, #8614): agents never run with permission checks disabled. Every
# claude call goes through scripts/lib/agent-exec.sh, which applies config/agent-permissions.json (dontAsk)
# and refuses a bypass flag. One exemption: scripts/sw-session.sh, the operator's terminal opt-in
# (--skip-permissions). It is refused under CI, test mode, pipelines and without a TTY, and the flag is
# spelled once in that file (meta.test.ts pins both). Nothing else may name a bypass.
id: F9-bash-no-permission-bypass
language: Bash
severity: error
metadata: { ratchet: false, owner: "@sethdford", docs: "docs/architecture.md#fitness-rules" }
message: "F9: agents never skip permission checks. Remove the bypass; agent-exec.sh applies config/agent-permissions.json (dontAsk). Read-only stages add --disallowedTools Edit,Write,NotebookEdit."
files:
  - "scripts/**/*.sh"
  - "scripts/sw"
  - ".claude/hooks/**/*.sh"
  - "claude-code/hooks/**/*.sh"
  - "completions/**/*.bash"
  - "install.sh"
ignores:
  - "scripts/sw-session.sh"
rule:
  matches: bash-text
  regex: '(?i)dangerously-skip-permissions|bypassPermissions|allowDangerouslySkipPermissions'
  not: { has: { regex: '(?i)dangerously-skip-permissions|bypassPermissions|allowDangerouslySkipPermissions' } }
