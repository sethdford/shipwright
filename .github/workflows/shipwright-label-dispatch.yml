name: Shipwright Label Dispatch

# The labeled entry point (#8572, ADR-0007). Labelling an issue `shipwright` runs the safety gates
# and, on "go", dispatches shipwright-pipeline.yml exactly as shipwright-dispatch.yml does, through
# the same two writes (.github/actions/dispatch-pipeline). A refusal is a notice and a successful run, not a
# failure: this workflow's runs are not in the breaker's history (GhRunHistory lists only
# shipwright-pipeline.yml runs), so a refused label cannot move the breaker. Unrelated labels start
# a run that every job skips, and this workflow has no concurrency group, so nothing queues.
on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  label-dispatch:
    if: github.event.label.name == 'shipwright'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: write starts the pipeline with GITHUB_TOKEN (workflow_dispatch is the one event a
    # GITHUB_TOKEN may trigger). issues: write posts the marker and the breaker's incident issue.
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the retry count
        id: retries
        shell: bash
        run: |
          # A relabel counts the bot's SHIPWRIGHT-RETRY markers, so the fix-loop cap still holds.
          # Unreadable markers stop the run (retry-state.sh fails closed).
          if ! STATE=$(scripts/ci/retry-state.sh "$ISSUE_NUMBER" "$GITHUB_RUN_ID"); then
            echo "::error::cannot read the retry state of #$ISSUE_NUMBER; nothing dispatched"
            exit 1
          fi
          RETRY=$(jq -r '.retry' <<<"$STATE")
          if ! [[ "$RETRY" =~ ^[0-9]+$ ]]; then
            echo "::error::unreadable retry count for #$ISSUE_NUMBER; nothing dispatched"
            exit 1
          fi
          echo "retry=$RETRY" >> "$GITHUB_OUTPUT"

      # A closed gate is a notice (on-refusal), so this run does not fail; `allowed` stays unset.
      - name: Safety gates
        id: gates
        uses: ./.github/actions/safety-gates
        with:
          retry: ${{ steps.retries.outputs.retry }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          on-refusal: notice

      - name: Pipeline already running for this issue?
        if: steps.gates.outputs.allowed == 'true'
        id: active
        shell: bash
        run: |
          # Same check 1 as shipwright-dispatch.yml. An unreadable listing fails the run.
          if ! ACTIVE=$(scripts/ci/pipeline-active.sh "$ISSUE_NUMBER"); then
            echo "::error::cannot list pipeline runs for #$ISSUE_NUMBER; not dispatching"
            exit 1
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"

      # The marker is posted before the dispatch (.github/actions/dispatch-pipeline).
      - name: Dispatch the pipeline
        if: steps.gates.outputs.allowed == 'true' && steps.active.outputs.active == 'false'
        uses: ./.github/actions/dispatch-pipeline
        with:
          issue: ${{ github.event.issue.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Note a skipped dispatch
        if: steps.gates.outputs.allowed != 'true' || steps.active.outputs.active == 'true'
        shell: bash
        run: |
          if [[ "$STEP_ACTIVE" == "true" ]]; then
            echo "::notice::Pipeline already running for #$ISSUE_NUMBER; nothing dispatched"
          else
            echo "::notice::Safety gates did not allow a dispatch for #$ISSUE_NUMBER; nothing dispatched"
          fi
        env:
          STEP_ACTIVE: ${{ steps.active.outputs.active }}
