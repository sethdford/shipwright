name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest

    # Dependabot and fork PRs run with a read-only token and NO access to repo
    # secrets, so claude_code_oauth_token interpolates to an empty string and the
    # action fails at the installation-token step ~12s in. That is what made this
    # a permanently-red check on every dependabot PR (#583, #635, #636). Lockfile
    # bumps do not need an AI review pass, so skip rather than paper over it.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      # Mirrors the integration-claude job in test.yml: a missing credential is
      # a skip, not a failure. Without this the job reports red on any PR where
      # the secret is unset or expired, which is indistinguishable from a real
      # review finding.
      - name: Check for Claude credentials
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN available — skipping Claude review"
            echo "SKIP_CLAUDE=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        if: env.SKIP_CLAUDE != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Resolve the review model from the trusted default branch (W2-07)
        id: review-model
        if: env.SKIP_CLAUDE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # config/models.json from the DEFAULT branch, not the PR checkout: a PR cannot change the reviewer's model.
          # Until the file is on the default branch (merge order: W2-07 lands last), the pinned opus ID is used with a
          # warning. The fallback literal is the one allowlisted line in tools/models/allowlist.json.
          DEFAULT="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/config/models.json?ref=${DEFAULT}" --jq '.content' > "$RUNNER_TEMP/models.b64" 2>/dev/null; then
            base64 -d < "$RUNNER_TEMP/models.b64" > "$RUNNER_TEMP/models.json"
            MODEL="$(jq -r '.aliases.opus // empty' "$RUNNER_TEMP/models.json")"
          else
            echo "::warning::config/models.json is not on ${DEFAULT} yet; using the pinned opus ID"
            MODEL="claude-opus-5-5"
          fi
          case "$MODEL" in
            claude-*) ;;
            *) echo "::error::no opus alias in the trusted config/models.json"; exit 1 ;;
          esac
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        if: env.SKIP_CLAUDE != 'true'
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1.0.250
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: --model ${{ steps.review-model.outputs.model }}
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

