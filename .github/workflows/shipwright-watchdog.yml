name: Shipwright Watchdog

# Intelligent pipeline monitor — detects stale/stuck runs using heartbeat signals
# rather than blunt timeouts. Checks every 15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      # For scripts/ci/bot-comments.sh. The watchdog never dispatches: auto-retry is the only
      # retry path (ADR-0007), so this job needs no safety gates.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Monitor in-progress pipeline runs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- Shipwright Watchdog: $(date -u +%Y-%m-%dT%H:%M:%SZ) ---"
          NOW_EPOCH=$(date +%s)

          # Get all in-progress pipeline runs (an unreadable list fails the job, never reads as none)
          if ! RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow=shipwright-pipeline.yml --status in_progress \
            --json databaseId,createdAt,displayTitle --limit 50); then
            echo "::error::cannot list in-progress pipeline runs"
            exit 1
          fi
          if ! RUN_COUNT=$(jq 'if type == "array" then length else error("not an array") end' <<<"$RUNS"); then
            echo "::error::malformed pipeline run list"
            exit 1
          fi
          if [[ "$RUN_COUNT" -eq 0 ]]; then
            echo "No in-progress pipeline runs. All clear."
            exit 0
          fi

          echo "Found $RUN_COUNT in-progress run(s)"

          STALE_COUNT=0
          CANCELLED_COUNT=0
          READ_FAILURES=0
          CANCEL_FAILURES=0

          while read -r run; do
            RUN_ID=$(echo "$run" | jq -r '.databaseId')
            CREATED_AT=$(echo "$run" | jq -r '.createdAt')
            TITLE=$(echo "$run" | jq -r '.displayTitle')

            echo ""
            echo "--- Run $RUN_ID: $TITLE ---"

            # Calculate elapsed time in minutes
            # An unparseable date would read as 1970 and cancel the run: leave it alone, fail at the end.
            if ! CREATED_EPOCH=$(date -d "$CREATED_AT" +%s); then
              echo "::error::cannot parse the start time '$CREATED_AT' of run $RUN_ID; leaving it alone"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi
            ELAPSED_SECS=$((NOW_EPOCH - CREATED_EPOCH))
            ELAPSED_MINS=$((ELAPSED_SECS / 60))
            echo "Elapsed: ${ELAPSED_MINS}m"

            # Skip young runs (< 30 min) — they're probably fine
            if [[ "$ELAPSED_MINS" -lt 30 ]]; then
              echo "Run is < 30 min old — skipping"
              continue
            fi

            # Try to extract issue number from the run title
            ISSUE_NUMBER=$(echo "$TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
            if [[ -z "$ISSUE_NUMBER" ]]; then
              echo "Cannot determine issue number — skipping"
              continue
            fi

            echo "Associated issue: #$ISSUE_NUMBER"

            # Bot-authored comments only: anyone can type a SHIPWRIGHT-* marker (ADR-0007).
            # Unreadable: leave the run alone (never cancel on missing signals), fail at the end.
            if ! COMMENTS_JSON=$(scripts/ci/bot-comments.sh "$ISSUE_NUMBER"); then
              echo "::error::cannot read bot comments for #$ISSUE_NUMBER; leaving run $RUN_ID alone"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi

            # Find the most recent SHIPWRIGHT-HEARTBEAT or SHIPWRIGHT-STAGE marker
            LAST_SIGNAL_DATE=""

            # Check for heartbeat markers: <!-- SHIPWRIGHT-HEARTBEAT: timestamp -->
            HEARTBEAT_DATE=$(jq -r '.[] | select(.body | contains("SHIPWRIGHT-HEARTBEAT")) | .createdAt' <<<"$COMMENTS_JSON" | tail -1)

            # Check for stage markers: <!-- SHIPWRIGHT-STAGE: ... -->
            STAGE_DATE=$(jq -r '.[] | select(.body | contains("SHIPWRIGHT-STAGE")) | .createdAt' <<<"$COMMENTS_JSON" | tail -1)

            # Check for the initial run ID marker: <!-- SHIPWRIGHT-RUN-ID: ... -->
            START_DATE=$(jq -r --arg m "SHIPWRIGHT-RUN-ID: $RUN_ID" '.[] | select(.body | contains($m)) | .createdAt' <<<"$COMMENTS_JSON" | tail -1)

            # Use the most recent signal
            for date in "$HEARTBEAT_DATE" "$STAGE_DATE" "$START_DATE"; do
              if [[ -n "$date" && ("$date" > "$LAST_SIGNAL_DATE" || -z "$LAST_SIGNAL_DATE") ]]; then
                LAST_SIGNAL_DATE="$date"
              fi
            done

            if [[ -z "$LAST_SIGNAL_DATE" ]]; then
              echo "No progress signals found — using run start time"
              LAST_SIGNAL_DATE="$CREATED_AT"
            fi

            # Calculate minutes since last signal
            if ! SIGNAL_EPOCH=$(date -d "$LAST_SIGNAL_DATE" +%s); then
              echo "::error::cannot parse the signal time '$LAST_SIGNAL_DATE' of run $RUN_ID; leaving it alone"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi
            SILENT_MINS=$(( (NOW_EPOCH - SIGNAL_EPOCH) / 60 ))
            echo "Last signal: ${LAST_SIGNAL_DATE} (${SILENT_MINS}m ago)"

            # ── Decision logic ──

            # Under 20 min silence: healthy
            if [[ "$SILENT_MINS" -lt 20 ]]; then
              echo "Status: HEALTHY (recent activity)"
              continue
            fi

            # 20-45 min silence on a 30+ min run: STALE — warn
            if [[ "$SILENT_MINS" -lt 45 ]]; then
              echo "Status: STALE (no signal in ${SILENT_MINS}m)"
              STALE_COUNT=$((STALE_COUNT + 1))

              # Post observation comment (only if we haven't already in this window)
              EXISTING_WATCHDOG=$(jq -r --arg m "SHIPWRIGHT-WATCHDOG-STALE: $RUN_ID" '.[] | select(.body | contains($m)) | .createdAt' <<<"$COMMENTS_JSON" | tail -1)
              if [[ -z "$EXISTING_WATCHDOG" ]]; then
                gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          :eye: **Shipwright Watchdog — Stale Pipeline Detected**

          Run [$RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) has had no progress signal for **${SILENT_MINS} minutes**.

          | Field | Value |
          |-------|-------|
          | Run | [$RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) |
          | Elapsed | ${ELAPSED_MINS}m |
          | Silent | ${SILENT_MINS}m |
          | Last Signal | ${LAST_SIGNAL_DATE} |
          | Action | Monitoring — will cancel if no progress in 45m |

          <!-- SHIPWRIGHT-WATCHDOG-STALE: $RUN_ID -->
          EOF
          )" 2>/dev/null || true
              fi
              continue
            fi

            # 45 min - 2h silence: cancel. Retrying is auto-retry's job alone: it runs on the
            # cancelled run, behind the safety gates and the fix-loop cap (ADR-0007).
            if [[ "$SILENT_MINS" -lt 120 ]]; then
              echo "Status: STUCK (${SILENT_MINS}m silence) — cancelling; auto-retry decides on a retry"
              # Cancel the run; a failed cancel is reported (and fails the job), with no comment.
              if ! gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"; then
                echo "::error::could not cancel stuck run $RUN_ID (#$ISSUE_NUMBER)"
                CANCEL_FAILURES=$((CANCEL_FAILURES + 1))
                continue
              fi
              CANCELLED_COUNT=$((CANCELLED_COUNT + 1))

              # Extract completed stages from comments
              COMPLETED_STAGES=$(jq -r '.[].body' <<<"$COMMENTS_JSON" | grep -oE 'SHIPWRIGHT-STAGE: [a-z_]+:complete' | sed 's/SHIPWRIGHT-STAGE: //' | sed 's/:complete//' | tr '\n' ',' | sed 's/,$//' || true)

              # Post cancellation comment
              gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          :rotating_light: **Shipwright Watchdog — Pipeline Cancelled (Stuck)**

          Run [$RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) was cancelled after **${SILENT_MINS} minutes** with no progress signal.

          | Field | Value |
          |-------|-------|
          | Run | [$RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) |
          | Elapsed | ${ELAPSED_MINS}m |
          | Silent | ${SILENT_MINS}m |
          | Completed Stages | \`${COMPLETED_STAGES:-none}\` |
          | Action | Cancelled — auto-retry decides whether to retry (safety gates, at most 3 retries) |

          <!-- SHIPWRIGHT-WATCHDOG-CANCEL: $RUN_ID -->
          EOF
          )" 2>/dev/null || true
              continue
            fi

            # > 2h silence: cancel, label stuck, DON'T retry
            echo "Status: ABANDONED (${SILENT_MINS}m silence, ${ELAPSED_MINS}m elapsed) — cancelling, no retry"

            # Label and comment BEFORE cancelling: auto-retry starts as soon as the run is
            # cancelled, and skips it only when the SHIPWRIGHT-WATCHDOG-ABANDON marker exists.
            # Label as stuck (dispatch and auto-retry skip shipwright-stuck issues until a human
            # clears it); without the label, do not cancel.
            if ! gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "shipwright-stuck"; then
              echo "::error::could not label #$ISSUE_NUMBER shipwright-stuck; not cancelling run $RUN_ID"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi

            # Post the marker comment; without it, do not cancel (auto-retry would retry the run).
            if ! gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          :stop_sign: **Shipwright Watchdog — Pipeline Abandoned**

          Run [$RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) was cancelled after **${ELAPSED_MINS} minutes** with no progress for **${SILENT_MINS} minutes**.

          This exceeds the 2-hour silence threshold. The pipeline will **not** be automatically retried.

          | Field | Value |
          |-------|-------|
          | Run | [$RUN_ID](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) |
          | Elapsed | ${ELAPSED_MINS}m |
          | Silent | ${SILENT_MINS}m |
          | Action | Cancelled — human review required |

          ### What to check
          1. Review the [run logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID) for errors
          2. Check if the issue is too complex for autonomous processing
          3. Consider breaking the issue into smaller sub-issues

          To retry manually:
          \`\`\`
          gh workflow run shipwright-pipeline.yml -f issue_number=$ISSUE_NUMBER -f template=full -f skip_triage=true
          \`\`\`

          <!-- SHIPWRIGHT-WATCHDOG-ABANDON: $RUN_ID -->
          EOF
          )"; then
              echo "::error::could not post the abandon marker on #$ISSUE_NUMBER; not cancelling run $RUN_ID"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi

            # Cancel the run (after the marker exists)
            if ! gh run cancel "$RUN_ID" --repo "$GITHUB_REPOSITORY"; then
              echo "::error::could not cancel abandoned run $RUN_ID (#$ISSUE_NUMBER)"
              CANCEL_FAILURES=$((CANCEL_FAILURES + 1))
              continue
            fi
            CANCELLED_COUNT=$((CANCELLED_COUNT + 1))

          done < <(echo "$RUNS" | jq -c '.[]')

          echo ""
          echo "--- Watchdog Summary ---"
          echo "Runs checked: $RUN_COUNT"
          echo "Stale (warned): $STALE_COUNT"
          echo "Cancelled: $CANCELLED_COUNT"
          echo "Read/marker failures: $READ_FAILURES"
          echo "Cancel failures: $CANCEL_FAILURES"
          if [[ "$READ_FAILURES" -gt 0 || "$CANCEL_FAILURES" -gt 0 ]]; then
            exit 1
          fi
