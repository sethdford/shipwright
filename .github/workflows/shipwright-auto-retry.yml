name: Shipwright Auto-Retry

# Automatically retries failed pipelines with error-aware escalating strategy
on:
  workflow_run:
    workflows: ["Shipwright Pipeline"]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

# One auto-retry at a time, so two failures cannot both read the same retry count. GitHub keeps
# at most one pending run per group: a third concurrent failure cancels the pending one. That
# failed run is then never retried and nothing labels it (fail-safe, but silent): dispatch skips
# the issue too (it carries SHIPWRIGHT-DISPATCHED), so a human must re-run it.
concurrency:
  group: shipwright-auto-retry
  cancel-in-progress: false

jobs:
  auto-retry:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    # Room for the safety gates' Bun install and the retry backoff (up to 90 s).
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Extract issue number from failed run
        id: extract
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

          echo "--- Auto-Retry: Analyzing failed run $RUN_ID ($CONCLUSION) ---"

          # Get the run details to extract issue number from inputs or title. A read failure fails
          # the job (no retry, but visible), never reads as "no issue".
          if ! RUN_JSON=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs,displayTitle); then
            echo "::error::cannot read run $RUN_ID; not retrying"
            exit 1
          fi
          if ! DISPLAY_TITLE=$(jq -r '.displayTitle // ""' <<<"$RUN_JSON"); then
            echo "::error::malformed details for run $RUN_ID; not retrying"
            exit 1
          fi

          # Try to extract issue number from run inputs
          # workflow_dispatch runs have inputs in the event payload
          ISSUE_NUMBER=""

          # Method 1: Parse from run's associated pull requests or title
          # The display title often contains the issue number
          if [[ -z "$ISSUE_NUMBER" ]]; then
            ISSUE_NUMBER=$(echo "$DISPLAY_TITLE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          fi

          # Method 2: Check run logs for the issue number
          if [[ -z "$ISSUE_NUMBER" ]]; then
            if ! FULL_LOG=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log); then
              echo "::error::cannot read the log of run $RUN_ID; not retrying"
              exit 1
            fi
            RUN_LOG=$(head -200 <<<"$FULL_LOG")
            ISSUE_NUMBER=$(echo "$RUN_LOG" | grep -oE 'Issue: #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          fi

          # Method 3: Look at recent shipwright-labeled issues with pipeline comments referencing this run
          if [[ -z "$ISSUE_NUMBER" ]]; then
            if ! OPEN_ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" \
              --label shipwright --state open --limit 200 --json number --jq '.[].number'); then
              echo "::error::cannot list shipwright issues; not retrying"
              exit 1
            fi

            for issue in $OPEN_ISSUES; do
              # Bot-authored comments only (ADR-0007); RUN_ID goes to jq as data, and only the
              # whole marker line <!-- SHIPWRIGHT-RUN-ID: <id> --> counts (not any substring).
              if ! COMMENTS_JSON=$(scripts/ci/bot-comments.sh "$issue"); then
                echo "::error::cannot read bot comments; refusing to retry"
                exit 1
              fi
              HAS_RUN=$(jq --arg m "<!-- SHIPWRIGHT-RUN-ID: ${RUN_ID} -->" \
                '[.[] | .body | strings | split("\n")[] | rtrimstr("\r") | select(. == $m)] | length' <<<"$COMMENTS_JSON")
              if [[ "$HAS_RUN" -gt 0 ]]; then
                ISSUE_NUMBER="$issue"
                break
              fi
            done
          fi

          if [[ -z "$ISSUE_NUMBER" ]]; then
            echo "Could not determine issue number from run $RUN_ID — skipping retry"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Found issue #$ISSUE_NUMBER for failed run $RUN_ID"

      # Bun runs the TypeScript failure classifier (W2-02). Pinned like the safety-gates action;
      # no lifecycle scripts run.
      - name: Set up Bun for the failure classifier
        if: steps.extract.outputs.issue_number != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19

      - name: Install the Shipwright CLI dependencies
        if: steps.extract.outputs.issue_number != ''
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      # ── Error categorization: fetch logs, classify failure, extract root cause ──
      - name: Categorize error from run logs
        if: steps.extract.outputs.issue_number != ''
        id: categorize
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ steps.extract.outputs.run_id }}
          CONCLUSION: ${{ steps.extract.outputs.conclusion }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
        run: |
          # Fetch the last 200 lines of the failed run's log
          LOG_TAIL=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log 2>/dev/null | tail -200 || echo "")

          # Default values
          ERROR_CATEGORY="UNKNOWN"
          LAST_ERROR=""
          FAILED_STAGE=""

          # Extract the last error message (look for common error patterns)
          LAST_ERROR=$(echo "$LOG_TAIL" | grep -iE "(error|fatal|fail|panic|exception)" | tail -1 || true)
          # Sanitize once, here: LAST_ERROR is log text (influenced by issue content) that is
          # later embedded in markdown table cells, inline code spans and a
          # <!-- SHIPWRIGHT-ERROR-MSG: ... --> marker that this step reads back for
          # fingerprinting. Strip CR/LF/tab, backticks, pipes and "-->" so it cannot break
          # out of those contexts, and defang "SHIPWRIGHT-" so it cannot spoof markers
          # (e.g. a trailing SHIPWRIGHT-RETRY: 0). Messages without these are unchanged.
          LAST_ERROR=$(printf '%s' "$LAST_ERROR" | tr '\r\n\t' '   ' | tr -d '`' | tr '|' '/')
          while [[ "$LAST_ERROR" == *"-->"* ]]; do LAST_ERROR="${LAST_ERROR//-->/->}"; done
          LAST_ERROR="${LAST_ERROR//SHIPWRIGHT-/SHIPWRIGHT_}"
          # Truncate to 200 chars for comment readability
          if [[ ${#LAST_ERROR} -gt 200 ]]; then
            LAST_ERROR="${LAST_ERROR:0:200}..."
          fi

          # Extract failed stage from bot-authored comments only (SHIPWRIGHT-RESULT marker);
          # a marker typed by anyone else is ignored (ADR-0007).
          if ! COMMENTS_JSON=$(scripts/ci/bot-comments.sh "$ISSUE_NUMBER"); then
            echo "::error::cannot read bot comments; refusing to retry"
            exit 1
          fi
          COMMENTS=$(jq -r '.[].body' <<<"$COMMENTS_JSON")
          FAILED_STAGE=$(echo "$COMMENTS" | grep -oE 'SHIPWRIGHT-RESULT: [0-9]+:[a-z_]+' | tail -1 | cut -d: -f3 || true)

          # ── Categorize the failure ──

          # Check if last run produced no code changes — don't retry empty builds
          NO_CHANGES=$(echo "$COMMENTS" | grep -c "SHIPWRIGHT-NO-CHANGES: true" || true)
          if [[ "${NO_CHANGES:-0}" -gt 0 ]]; then
            ERROR_CATEGORY="DESIGN_FAILURE"
            LAST_ERROR="Pipeline produced no code changes — build agent did not modify source files"
          fi

          # If the run was cancelled (e.g., by watchdog), treat as TRANSIENT
          if [[ "$CONCLUSION" == "cancelled" ]]; then
            ERROR_CATEGORY="TRANSIENT"
          fi

          # Typed classification (W2-02): exit 0 = retry, 3 = escalate. Any other exit fails the job.
          # Input is the failed steps' log only (I2): `--log-failed` leaves out steps that passed, so a
          # passing pre-flight step cannot produce a false auth match. Fails closed when unreadable.
          # The text is data: it reaches the classifier as a file, never as a command string.
          if ! FAILED_LOG=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed); then
            echo "::error::cannot read the failed-step log of run $RUN_ID; not retrying"
            exit 1
          fi
          printf '%s\n' "$FAILED_LOG" > "$RUNNER_TEMP/failed-run.log"
          if bun src/cli.ts failure classify --log "$RUNNER_TEMP/failed-run.log" --json > "$RUNNER_TEMP/classify.json"; then
            CLASSIFY_RC=0
          else
            CLASSIFY_RC=$?
          fi
          if [[ "$CLASSIFY_RC" -ne 0 && "$CLASSIFY_RC" -ne 3 ]]; then
            echo "::error::failure classifier failed (exit $CLASSIFY_RC); not retrying"
            exit 1
          fi
          if ! FAILURE_CLASS=$(jq -r '.class' "$RUNNER_TEMP/classify.json"); then
            echo "::error::failure classifier output is unreadable; not retrying"
            exit 1
          fi
          # An unknown or empty class fails closed: no retry on a verdict this code does not know.
          case "$FAILURE_CLASS" in
            auth|invalid_input|environment|transient|budget|max_turns|refusal|schema|truncated|timeout|execution|contamination|unknown) ;;
            *)
              echo "::error::failure classifier returned an unknown class ('$FAILURE_CLASS'); not retrying"
              exit 1
              ;;
          esac
          echo "Classifier: $FAILURE_CLASS"
          if [[ "$FAILURE_CLASS" == "auth" ]]; then
            ERROR_CATEGORY="AUTH"
          fi
          # Deviation from the plan (#8674): a transient verdict from log text is never used. Log text
          # is free text an agent, issue or model can write, so "HTTP 503" or "ECONNRESET" in it does
          # not make a retry. Transient comes only from the trusted timed_out conclusion below.
          if [[ "$FAILURE_CLASS" == "transient" ]]; then
            echo "Classifier said transient from log text; not used (#8674)"
          fi

          # TRANSIENT only from trusted data (#8674): a job or step that the API reports as timed out,
          # or a run that was cancelled (above). Log text never sets it. The job read fails closed.
          if [[ "$ERROR_CATEGORY" == "UNKNOWN" ]]; then
            if ! RUN_JOBS=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs); then
              echo "::error::cannot read the jobs of run $RUN_ID; not retrying"
              exit 1
            fi
            TIMED_OUT=$(jq '[.jobs[]? | select(.conclusion == "timed_out" or any(.steps[]?; .conclusion == "timed_out"))] | length' <<<"$RUN_JOBS")
            if [[ "${TIMED_OUT:-0}" -gt 0 ]]; then
              ERROR_CATEGORY="TRANSIENT"
            fi
          fi

          # Check for INFRA patterns: git failures, permissions, disk/memory
          if [[ "$ERROR_CATEGORY" == "UNKNOWN" ]]; then
            INFRA_MATCH=$(echo "$LOG_TAIL" | grep -ciE "permission denied|git.*fatal|ENOMEM|disk.*full|no space left|out of memory|cannot allocate" || true)
            if [[ "${INFRA_MATCH:-0}" -gt 0 ]]; then
              ERROR_CATEGORY="INFRA"
            fi
          fi

          # Check for BUILD_FAILURE patterns: test/build/lint errors
          if [[ "$ERROR_CATEGORY" == "UNKNOWN" ]]; then
            BUILD_MATCH=$(echo "$LOG_TAIL" | grep -ciE "test.*fail|assert|FAIL.*test|npm ERR|build.*fail|lint.*error|compilation.*error|SyntaxError|TypeError" || true)
            if [[ "${BUILD_MATCH:-0}" -gt 0 ]]; then
              ERROR_CATEGORY="BUILD_FAILURE"
            fi
          fi

          # Check for DESIGN_FAILURE: same error pattern across 2+ retries
          # Look at previous retry comments for matching error messages
          if [[ "$ERROR_CATEGORY" == "BUILD_FAILURE" || "$ERROR_CATEGORY" == "UNKNOWN" ]]; then
            # Get error messages from previous retry comments
            PREV_ERRORS=$(echo "$COMMENTS" | grep -oE 'SHIPWRIGHT-ERROR-MSG: [^<]+' | sed 's/SHIPWRIGHT-ERROR-MSG: //' || true)
            if [[ -n "$PREV_ERRORS" && -n "$LAST_ERROR" ]]; then
              # Extract first 50 chars of current error as a fingerprint
              ERROR_FINGERPRINT="${LAST_ERROR:0:50}"
              REPEAT_COUNT=$(echo "$PREV_ERRORS" | grep -cF "$ERROR_FINGERPRINT" || true)
              if [[ "${REPEAT_COUNT:-0}" -ge 1 ]]; then
                ERROR_CATEGORY="DESIGN_FAILURE"
              fi
            fi
          fi

          # Default remaining unknowns to BUILD_FAILURE (safest retry strategy)
          if [[ "$ERROR_CATEGORY" == "UNKNOWN" ]]; then
            ERROR_CATEGORY="BUILD_FAILURE"
          fi

          echo "--- Error Analysis ---"
          echo "Category: $ERROR_CATEGORY"
          echo "Failed stage: ${FAILED_STAGE:-unknown}"
          echo "Last error: ${LAST_ERROR:-none}"

          echo "error_category=$ERROR_CATEGORY" >> "$GITHUB_OUTPUT"
          echo "failed_stage=${FAILED_STAGE:-unknown}" >> "$GITHUB_OUTPUT"

          # Multi-line outputs
          d="ghadelim_$(openssl rand -hex 8)"
          {
            echo "last_error<<$d"
            echo "${LAST_ERROR:-No error message extracted}"
            echo "$d"
          } >> "$GITHUB_OUTPUT"

      - name: Check retry count and determine strategy
        if: steps.extract.outputs.issue_number != ''
        id: strategy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          RUN_ID: ${{ steps.extract.outputs.run_id }}
          ERROR_CATEGORY: ${{ steps.categorize.outputs.error_category }}
        run: |
          # Bot-authored comments only (ADR-0007). Unreadable: do not retry, because a
          # missing count would restart the loop at 0.
          if ! COMMENTS_JSON=$(scripts/ci/bot-comments.sh "$ISSUE_NUMBER"); then
            echo "::error::cannot read bot comments; refusing to retry"
            exit 1
          fi
          COMMENTS=$(jq -r '.[].body' <<<"$COMMENTS_JSON")

          # Retry count = the highest bot SHIPWRIGHT-RETRY marker; refuses when retry markers
          # exist only from other authors. Also reports the watchdog's abandon marker.
          if ! RETRY_STATE=$(scripts/ci/retry-state.sh "$ISSUE_NUMBER" "$RUN_ID"); then
            echo "::error::cannot establish the retry count for #$ISSUE_NUMBER; refusing to retry"
            exit 1
          fi

          # A run the watchdog abandoned (silent over 2h) is never retried automatically.
          if [[ "$(jq -r '.abandoned' <<<"$RETRY_STATE")" == "true" ]]; then
            echo "Run $RUN_ID was abandoned by the watchdog — not retrying"
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=abandoned" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auth failures are never retried: a retry cannot repair a credential (W2-03).
          if [[ "$ERROR_CATEGORY" == "AUTH" ]]; then
            echo "Run $RUN_ID failed authentication: not retrying; the credential needs a human"
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=auth" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RETRY_COUNT=$(jq -r '.retry' <<<"$RETRY_STATE")

          # Held issues (auto-patrol, shipwright-stuck, -failed, -infra-issue) wait for a human.
          # shellcheck source=/dev/null
          source scripts/lib/safety-gates.sh
          if ! ISSUE_JSON=$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json number,labels); then
            echo "::error::cannot read the labels of #$ISSUE_NUMBER; refusing to retry"
            exit 1
          fi
          if ! ELIGIBLE=$(jq -c '[.]' <<<"$ISSUE_JSON" | dispatchable_issue_numbers); then
            echo "::error::cannot read the labels of #$ISSUE_NUMBER; refusing to retry"
            exit 1
          fi
          if [[ "$ELIGIBLE" != "$ISSUE_NUMBER" ]]; then
            echo "Issue #$ISSUE_NUMBER is held by a label — not retrying"
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=held" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Another pipeline for this issue is already running or queued: nothing to retry.
          if ! ACTIVE=$(scripts/ci/pipeline-active.sh "$ISSUE_NUMBER"); then
            echo "::error::cannot list pipeline runs for #$ISSUE_NUMBER; refusing to retry"
            exit 1
          fi
          if [[ "$ACTIVE" == "true" ]]; then
            echo "A pipeline for #$ISSUE_NUMBER is already running or queued — not retrying"
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=active" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Current retry count: $RETRY_COUNT"

          # Extract last failed stage from result comment
          LAST_STAGE=$(echo "$COMMENTS" | grep -oE 'SHIPWRIGHT-RESULT: [0-9]+:[a-z_]+' | tail -1 | cut -d: -f3 || echo "")

          # Extract completed stages from stage event comments
          # Only skip pre-build stages on retry — build must always re-run to produce code changes
          RAW_STAGES=$(echo "$COMMENTS" | grep -oE 'SHIPWRIGHT-STAGE: [a-z_]+:complete' | sed 's/SHIPWRIGHT-STAGE: //' | sed 's/:complete//' | sort -u || echo "")
          COMPLETED_STAGES=""
          for stage in $RAW_STAGES; do
            case "$stage" in
              intake|plan|design) COMPLETED_STAGES="${COMPLETED_STAGES:+$COMPLETED_STAGES,}$stage" ;;
            esac
          done

          echo "Last failed stage: ${LAST_STAGE:-unknown}"
          echo "Completed stages: ${COMPLETED_STAGES:-none}"
          echo "Error category: $ERROR_CATEGORY"

          # ── INFRA errors: never retry, alert immediately ──
          if [[ "$ERROR_CATEGORY" == "INFRA" ]]; then
            echo "INFRA error detected — skipping retry, creating alert"
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=infra" >> "$GITHUB_OUTPUT"
            echo "retry_count=$RETRY_COUNT" >> "$GITHUB_OUTPUT"
            echo "last_stage=$LAST_STAGE" >> "$GITHUB_OUTPUT"
            echo "completed_stages=$COMPLETED_STAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RETRY_COUNT" -ge 3 ]]; then
            echo "Max retries (3) reached for issue #$ISSUE_NUMBER — giving up"
            echo "should_retry=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=exhausted" >> "$GITHUB_OUTPUT"
            echo "retry_count=$RETRY_COUNT" >> "$GITHUB_OUTPUT"
            echo "last_stage=$LAST_STAGE" >> "$GITHUB_OUTPUT"
            echo "completed_stages=$COMPLETED_STAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEXT_RETRY=$((RETRY_COUNT + 1))
          echo "retry_count=$NEXT_RETRY" >> "$GITHUB_OUTPUT"
          echo "should_retry=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          echo "last_stage=$LAST_STAGE" >> "$GITHUB_OUTPUT"
          echo "completed_stages=$COMPLETED_STAGES" >> "$GITHUB_OUTPUT"

          # ── Adaptive strategy based on error category ──
          case "$ERROR_CATEGORY" in
            TRANSIENT)
              # Transient: retry with same config (just bad luck)
              TEMPLATE="standard"
              MAX_ITERATIONS="20"
              ;;
            BUILD_FAILURE)
              # Build failure: escalate template, increase iterations
              case "$NEXT_RETRY" in
                1) TEMPLATE="standard"; MAX_ITERATIONS="25" ;;
                2) TEMPLATE="full";     MAX_ITERATIONS="25" ;;
                3) TEMPLATE="full";     MAX_ITERATIONS="30" ;;
              esac
              ;;
            DESIGN_FAILURE)
              # Design failure: same error repeating — use full template, max iterations
              TEMPLATE="full"
              MAX_ITERATIONS="30"
              ;;
            *)
              # Fallback: escalation table from retry count
              case "$NEXT_RETRY" in
                1) TEMPLATE="standard"; MAX_ITERATIONS="20" ;;
                2) TEMPLATE="full";     MAX_ITERATIONS="25" ;;
                3) TEMPLATE="full";     MAX_ITERATIONS="30" ;;
              esac
              ;;
          esac

          echo "template=$TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "max_iterations=$MAX_ITERATIONS" >> "$GITHUB_OUTPUT"

          echo "--- Retry Strategy ---"
          echo "Category: $ERROR_CATEGORY"
          echo "Retry: $NEXT_RETRY/3"
          echo "Template: $TEMPLATE"
          echo "Max Iterations: $MAX_ITERATIONS"
          echo "Resume from: ${COMPLETED_STAGES:-start}"

      # Back off BEFORE the gates, so that they are read just before the dispatch.
      - name: Back off before retrying
        if: steps.strategy.outputs.should_retry == 'true'
        shell: bash
        env:
          RETRY_COUNT: ${{ steps.strategy.outputs.retry_count }}
        run: |
          BACKOFF=$((RETRY_COUNT * 30))
          echo "Waiting ${BACKOFF}s before retry ${RETRY_COUNT}..."
          sleep "$BACKOFF"

      # Fails the job unless every gate allows dispatch (ADR-0007); retry is the retry
      # about to be dispatched (1-3), for the fix-loop cap.
      - name: Safety gates
        id: gates
        if: steps.strategy.outputs.should_retry == 'true'
        uses: ./.github/actions/safety-gates
        with:
          retry: ${{ steps.strategy.outputs.retry_count }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post retry comment with root cause
        id: comment
        if: steps.strategy.outputs.should_retry == 'true' && steps.gates.outputs.allowed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_ERROR: ${{ steps.categorize.outputs.last_error }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          RETRY_COUNT: ${{ steps.strategy.outputs.retry_count }}
          TEMPLATE: ${{ steps.strategy.outputs.template }}
          MAX_ITERATIONS: ${{ steps.strategy.outputs.max_iterations }}
          LAST_STAGE: ${{ steps.strategy.outputs.last_stage }}
          COMPLETED_STAGES: ${{ steps.strategy.outputs.completed_stages }}
          FAILED_RUN: ${{ steps.extract.outputs.run_id }}
          CONCLUSION: ${{ steps.extract.outputs.conclusion }}
          ERROR_CATEGORY: ${{ steps.categorize.outputs.error_category }}
          FAILED_STAGE: ${{ steps.categorize.outputs.failed_stage }}
        run: |
          # Re-check after the backoff: a pipeline may have started for this issue meanwhile.
          if ! ACTIVE=$(scripts/ci/pipeline-active.sh "$ISSUE_NUMBER"); then
            echo "::error::cannot list pipeline runs for #$ISSUE_NUMBER; not retrying"
            exit 1
          fi
          if [[ "$ACTIVE" == "true" ]]; then
            echo "A pipeline for #$ISSUE_NUMBER started meanwhile — not retrying"
            echo "posted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build human-readable category label
          case "$ERROR_CATEGORY" in
            TRANSIENT)      CATEGORY_LABEL="Transient (timeout/network)" ;;
            BUILD_FAILURE)  CATEGORY_LABEL="Build/Test Failure" ;;
            DESIGN_FAILURE) CATEGORY_LABEL="Repeated Failure (design issue)" ;;
            *)              CATEGORY_LABEL="$ERROR_CATEGORY" ;;
          esac

          # Design failure gets an extra warning
          DESIGN_NOTE=""
          if [[ "$ERROR_CATEGORY" == "DESIGN_FAILURE" ]]; then
            DESIGN_NOTE="
          > **Note**: This error has occurred in previous retries. The issue may need human review or simplification."
          fi

          # The SHIPWRIGHT-RETRY marker below is the retry count: if it cannot be posted, fail
          # so that nothing is dispatched (an uncounted retry would loop forever).
          if ! gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          :arrows_counterclockwise: **Shipwright Auto-Retry** (attempt ${RETRY_COUNT}/3)

          Previous run ${CONCLUSION} at stage: \`${LAST_STAGE:-unknown}\`

          | Field | Value |
          |-------|-------|
          | Retry | ${RETRY_COUNT}/3 |
          | Template | \`${TEMPLATE}\` |
          | Max Iterations | ${MAX_ITERATIONS} |
          | Resume Stages | \`${COMPLETED_STAGES:-none}\` |
          | Failed Run | [${FAILED_RUN}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}) |

          ### Root Cause Analysis

          | Field | Value |
          |-------|-------|
          | Error Category | **${CATEGORY_LABEL}** |
          | Failed Stage | \`${FAILED_STAGE}\` |
          | Last Error | \`${LAST_ERROR}\` |
          ${DESIGN_NOTE}

          <!-- SHIPWRIGHT-RETRY: ${RETRY_COUNT} -->
          <!-- SHIPWRIGHT-RETRY-CATEGORY: ${ERROR_CATEGORY} -->
          <!-- SHIPWRIGHT-ERROR-MSG: ${LAST_ERROR} -->
          <!-- SHIPWRIGHT-LAST-STAGE: ${LAST_STAGE} -->
          <!-- SHIPWRIGHT-FAILED-RUN: ${FAILED_RUN} -->
          EOF
          )"; then
            echo "::error::could not post the retry marker on #$ISSUE_NUMBER; not retrying"
            exit 1
          fi
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch retry pipeline
        if: steps.strategy.outputs.should_retry == 'true' && steps.gates.outputs.allowed == 'true' && steps.comment.outputs.posted == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          TEMPLATE: ${{ steps.strategy.outputs.template }}
          MAX_ITERATIONS: ${{ steps.strategy.outputs.max_iterations }}
          COMPLETED_STAGES: ${{ steps.strategy.outputs.completed_stages }}
        run: |
          echo "Dispatching retry pipeline for issue #$ISSUE_NUMBER..."
          if ! gh workflow run shipwright-pipeline.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f issue_number="$ISSUE_NUMBER" \
            -f template="$TEMPLATE" \
            -f max_iterations="$MAX_ITERATIONS" \
            -f completed_stages="$COMPLETED_STAGES" \
            -f skip_triage=true; then
            echo "::error::failed to dispatch the retry for #$ISSUE_NUMBER (its retry marker is posted)"
            exit 1
          fi

          echo "Retry dispatched successfully"

      # ── INFRA failure: don't retry, label and alert ──
      - name: Handle INFRA failure (no retry)
        if: steps.strategy.outputs.skip_reason == 'infra' && steps.extract.outputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_ERROR: ${{ steps.categorize.outputs.last_error }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          FAILED_RUN: ${{ steps.extract.outputs.run_id }}
          ERROR_CATEGORY: ${{ steps.categorize.outputs.error_category }}
          FAILED_STAGE: ${{ steps.categorize.outputs.failed_stage }}
        run: |
          # Add infra-issue label
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "shipwright-infra-issue" 2>/dev/null || true

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          :warning: **Shipwright Auto-Retry — Infrastructure Error (Not Retrying)**

          The pipeline failed with an infrastructure error that auto-retry cannot fix.

          | Field | Value |
          |-------|-------|
          | Error Category | **Infrastructure** |
          | Failed Stage | \`${FAILED_STAGE}\` |
          | Last Error | \`${LAST_ERROR}\` |
          | Failed Run | [${FAILED_RUN}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}) |

          ### Likely Causes
          - Git permission or authentication error
          - Runner out of memory or disk space
          - Network/filesystem infrastructure issue

          ### Action Required
          1. Check the [run logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}) for the infrastructure error
          2. Fix the underlying infrastructure issue
          3. Retry manually once resolved:
          \`\`\`
          gh workflow run shipwright-pipeline.yml -f issue_number=$ISSUE_NUMBER -f template=full -f skip_triage=true
          \`\`\`

          <!-- SHIPWRIGHT-INFRA-ALERT: ${FAILED_RUN} -->
          <!-- SHIPWRIGHT-ERROR-MSG: ${LAST_ERROR} -->
          EOF
          )" 2>/dev/null || true

      # ── AUTH failure: no retry; post the marker that dispatch already recognises (W2-03) ──
      - name: Handle AUTH failure (no retry)
        if: steps.strategy.outputs.skip_reason == 'auth' && steps.extract.outputs.issue_number != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          RUN_ID: ${{ steps.extract.outputs.run_id }}
        run: |
          BODY="$RUNNER_TEMP/auth-body.md"
          {
            echo "## Pipeline Auth Failure"
            echo
            echo "Run [$RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) failed authentication. Shipwright will not retry it."
            echo
            echo "Check the \`CLAUDE_CODE_OAUTH_TOKEN\` secret, and run \`claude setup-token\` locally to replace it."
            echo
            echo "<!-- SHIPWRIGHT-RETRY-CATEGORY: AUTH -->"
          } > "$BODY"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"

      # ── Max retries exhausted: post detailed analysis of all attempts ──
      - name: Mark issue as failed (max retries exhausted)
        if: steps.strategy.outputs.skip_reason == 'exhausted' && steps.extract.outputs.issue_number != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_ERROR: ${{ steps.categorize.outputs.last_error }}
          ISSUE_NUMBER: ${{ steps.extract.outputs.issue_number }}
          RETRY_COUNT: ${{ steps.strategy.outputs.retry_count }}
          FAILED_RUN: ${{ steps.extract.outputs.run_id }}
          ERROR_CATEGORY: ${{ steps.categorize.outputs.error_category }}
          FAILED_STAGE: ${{ steps.categorize.outputs.failed_stage }}
        run: |
          # Build a summary of all retry attempts from bot-authored comments. Display only:
          # unreadable comments leave the history empty; the issue is still labelled failed.
          if ! COMMENTS_JSON=$(scripts/ci/bot-comments.sh "$ISSUE_NUMBER"); then
            echo "::warning::cannot read bot comments; retry history omitted"
            COMMENTS_JSON="[]"
          fi
          COMMENTS=$(jq -r '.[].body' <<<"$COMMENTS_JSON")

          ATTEMPT_SUMMARY=""
          for i in 1 2 3; do
            # Find the retry comment for attempt $i
            ATTEMPT_CATEGORY=$(echo "$COMMENTS" | grep -A1 "SHIPWRIGHT-RETRY: $i" | grep -oE 'SHIPWRIGHT-RETRY-CATEGORY: [A-Z_]+' | sed 's/SHIPWRIGHT-RETRY-CATEGORY: //' || echo "N/A")
            ATTEMPT_ERROR=$(echo "$COMMENTS" | grep -A2 "SHIPWRIGHT-RETRY: $i" | grep -oE 'SHIPWRIGHT-ERROR-MSG: [^<]+' | sed 's/SHIPWRIGHT-ERROR-MSG: //' | head -c 100 || echo "N/A")
            ATTEMPT_STAGE=$(echo "$COMMENTS" | grep -A3 "SHIPWRIGHT-RETRY: $i" | grep -oE 'SHIPWRIGHT-LAST-STAGE: [a-z_]+' | sed 's/SHIPWRIGHT-LAST-STAGE: //' || echo "N/A")

            if [[ "$ATTEMPT_CATEGORY" != "N/A" || "$i" -le "$RETRY_COUNT" ]]; then
              ATTEMPT_SUMMARY="${ATTEMPT_SUMMARY}| ${i} | ${ATTEMPT_CATEGORY:-N/A} | \`${ATTEMPT_STAGE:-N/A}\` | \`${ATTEMPT_ERROR:-N/A}\` |
          "
            fi
          done

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          :x: **Shipwright Auto-Retry Exhausted**

          All ${RETRY_COUNT} retry attempts have failed for this issue. Human intervention is needed.

          ### Final Failure
          | Field | Value |
          |-------|-------|
          | Error Category | **${ERROR_CATEGORY}** |
          | Failed Stage | \`${FAILED_STAGE}\` |
          | Last Error | \`${LAST_ERROR}\` |
          | Failed Run | [${FAILED_RUN}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${FAILED_RUN}) |

          ### Retry History

          | Attempt | Category | Stage | Error |
          |---------|----------|-------|-------|
          ${ATTEMPT_SUMMARY}

          ### What to check
          1. Review the [workflow runs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/shipwright-pipeline.yml) for error patterns
          2. Check if the issue requirements are achievable by the autonomous pipeline
          3. Consider breaking the issue into smaller sub-issues

          To retry manually:
          \`\`\`
          gh workflow run shipwright-pipeline.yml -f issue_number=$ISSUE_NUMBER -f template=full -f skip_triage=true
          \`\`\`
          EOF
          )" 2>/dev/null || true

          # Add failed label for visibility
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label "shipwright-failed" 2>/dev/null || true
