name: Shipwright Dispatch

# Bridges shipwright labeled issues to pipeline dispatch.
# Runs every 15 minutes — picks up issues that have been triaged and labeled.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write
  pull-requests: read

concurrency:
  group: shipwright-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Fails the job unless every gate allows dispatch (ADR-0007).
      - name: Safety gates
        id: gates
        uses: ./.github/actions/safety-gates
        with:
          retry: "0"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan and dispatch shipwright-labeled issues
        if: steps.gates.outputs.allowed == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_DISPATCH: "3"
        run: |
          echo "--- Shipwright Dispatch: $(date -u +%Y-%m-%dT%H:%M:%SZ) ---"

          # Open issues with the 'shipwright' label, minus auto-filed (auto-patrol), shipwright-stuck,
          # shipwright-failed and shipwright-infra-issue ones: those wait until a human removes
          # that label (ADR-0007).
          # shellcheck source=/dev/null
          source scripts/lib/safety-gates.sh
          if ! ISSUE_LIST=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label shipwright --state open --limit 200 --json number,labels); then
            echo "::error::cannot list shipwright issues"
            exit 1
          fi
          if ! ISSUES=$(dispatchable_issue_numbers <<<"$ISSUE_LIST"); then
            echo "::error::cannot read the shipwright issue list"
            exit 1
          fi

          if [[ -z "$ISSUES" ]]; then
            echo "No open shipwright-labeled issues found."
            exit 0
          fi

          echo "Found shipwright-labeled issues: $ISSUES"

          DISPATCHED=0
          SKIPPED=0
          READ_FAILURES=0

          for issue in $ISSUES; do
            echo ""
            echo "--- Checking issue #$issue ---"

            # ── First dispatch only (ADR-0007): the same state rule as shipwright-label-dispatch.yml ──
            # ready: no run queued or running, and no bot comment says it was dispatched, retried or run.
            # active or handled: skip. A read failure leaves the issue alone and fails the job.
            if ! STATE=$(scripts/ci/issue-dispatch-state.sh "$issue"); then
              echo "::error::cannot read the dispatch state of #$issue; leaving it alone"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi
            case "$STATE" in
              ready) ;;
              active)
                echo "Issue #$issue: pipeline already running/queued — skipping"
                SKIPPED=$((SKIPPED + 1))
                continue
                ;;
              handled)
                echo "Issue #$issue: already dispatched or run — auto-retry owns any retry; skipping"
                SKIPPED=$((SKIPPED + 1))
                continue
                ;;
              *)
                echo "::error::unexpected dispatch state '$STATE' for #$issue; leaving it alone"
                READ_FAILURES=$((READ_FAILURES + 1))
                continue
                ;;
            esac

            # ── Per-run cap, then the gates again: an earlier dispatch may have closed one ──
            if [[ "$DISPATCHED" -ge "$MAX_DISPATCH" ]]; then
              echo "Dispatched $DISPATCHED issue(s), the per-run cap — stopping"
              break
            fi
            if ! bun src/cli.ts gates check --retry 0; then
              echo "::warning::Safety gates no longer allow dispatch — stopping"
              break
            fi

            # ── Half-open breaker: exactly one probe per run (#8575, ADR-0007) ──
            # `breaker status` reports half_open once the cool-down is over. The gate check above has
            # just passed, so no probe is in flight: this dispatch is the probe. After it, this run
            # stops, because the new run may not be listed yet and the next gate check could miss it.
            if ! BREAKER_JSON=$(bun src/cli.ts breaker status --json); then
              echo "::error::cannot read the breaker state of #$issue; not dispatching — stopping"
              READ_FAILURES=$((READ_FAILURES + 1))
              break
            fi
            # Strict: .state must be a string. Empty output, a missing state or a non-string fails.
            if ! BREAKER_STATE=$(jq -er '.state | strings' <<<"$BREAKER_JSON"); then
              echo "::error::unreadable breaker state for #$issue; not dispatching — stopping"
              READ_FAILURES=$((READ_FAILURES + 1))
              break
            fi
            # Only closed and half_open may dispatch. Any other state (open included) is a read failure.
            case "$BREAKER_STATE" in
              closed|half_open) ;;
              *)
                echo "::error::breaker state '$BREAKER_STATE' for #$issue is not closed or half_open; not dispatching — stopping"
                READ_FAILURES=$((READ_FAILURES + 1))
                break
                ;;
            esac

            # ── All checks passed — mark, then dispatch ──
            # The marker goes first: if it cannot be posted, nothing is dispatched, so no run can
            # exist that a later dispatch would not see.
            REQUESTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if ! gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body "Shipwright dispatch requested a pipeline run for this issue.

          <!-- SHIPWRIGHT-DISPATCHED: run-request ${REQUESTED_AT} -->"; then
              echo "::error::could not post the dispatch marker on #$issue; not dispatching — stopping"
              exit 1
            fi
            echo "Issue #$issue: dispatching pipeline..."
            if ! gh workflow run shipwright-pipeline.yml \
              --repo "$GITHUB_REPOSITORY" \
              -f issue_number="$issue" \
              -f template=standard; then
              echo "::error::failed to dispatch a pipeline for #$issue — stopping"
              exit 1
            fi
            echo "Issue #$issue: pipeline dispatched"
            DISPATCHED=$((DISPATCHED + 1))

            if [[ "$BREAKER_STATE" == "half_open" ]]; then
              echo "Breaker half-open: #$issue was the probe; no further dispatch this run"
              break
            fi

            sleep 5  # Avoid rate limiting between dispatches
          done

          echo ""
          echo "--- Dispatch Summary ---"
          echo "Dispatched: $DISPATCHED"
          echo "Skipped: $SKIPPED"
          echo "Read failures: $READ_FAILURES"
          if [[ "$READ_FAILURES" -gt 0 ]]; then
            exit 1
          fi
