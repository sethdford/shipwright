name: Website build

# Builds the docs site on PRs that touch it. website.yml only builds on push to main,
# so without this a dependency bump that breaks the build could merge green.
# Keep node-version in step with website.yml.

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.4' # Astro 7 requires >=22.23.4
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build
        run: npm run build
        working-directory: website
