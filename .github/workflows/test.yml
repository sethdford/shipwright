name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check version consistency
        run: bash scripts/check-version-consistency.sh

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux jq

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq

      - name: Snapshot the agent permission policy (#8614)
        # CI=true makes agent-exec refuse a policy inside the checkout, so the suites that run agent-exec
        # need the snapshot outside it, exactly as the pipeline has it.
        run: scripts/ci/snapshot-agent-policy.sh

      - name: Run all test suites
        # Same runner as `npm test`, so local and CI results cannot diverge.
        # It auto-discovers scripts/*-test.sh, runs each independently, and
        # applies a per-suite timeout — previously a single hung suite could
        # stall this job until the workflow-level limit killed it with no
        # indication of which suite was responsible.
        # 25 lines of tail truncated the failing assertion for several suites,
        # leaving CI showing that a suite failed but not which check. Only
        # printed on failure, so a green run is unaffected.
        env:
          FAIL_LOG_LINES: 120
        run: |
          bash scripts/sw-test-all.sh --timeout 300

  # The main matrix runs bash 5 only (Homebrew on macOS), so bash-3.2-only bugs (the fleet
  # heartbeat `--data-binary @<(...)` bug, #8578) cannot show up there. This leg runs the
  # gate, daemon, fleet and self-optimize suites under macOS system bash (/bin/bash, 3.2).
  # bash resolves to system bash 3.2 for every step (asserted), so a suite's shebang picks 3.2 too.
  bash32-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install dependencies
        run: brew install tmux jq

      # Child scripts run as `bash script` or through an env shebang, so they pick up whichever bash is
      # first on PATH. Homebrew puts bash 5 ahead of /bin/bash, so put system bash first under the name
      # `bash` for every later step (GITHUB_PATH).
      - name: Put system bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/b32"
          ln -sf /bin/bash "$RUNNER_TEMP/b32/bash"
          echo "$RUNNER_TEMP/b32" >> "$GITHUB_PATH"

      - name: Assert `bash` is 3.2
        run: |
          v=$(bash -c 'echo "$BASH_VERSION"')
          case "$v" in
            3.2*) echo "bash resolves to $v (system bash)" ;;
            *) echo "::error::bash resolves to '$v', not 3.2; the bash 3.2 leg would test the wrong shell"; exit 1 ;;
          esac

      - name: Run bash 3.2 suites
        run: |
          bash --version | head -1
          # Fleet suites drive tmux: a private socket directory, as sw-test-all.sh does.
          export TMUX_TMPDIR="$RUNNER_TEMP/tmux"
          mkdir -p "$TMUX_TMPDIR"
          unset TMUX TMUX_PANE
          failed=0
          for suite in \
            scripts/sw-lib-safety-gates-test.sh \
            scripts/sw-lib-safety-gates-sites-test.sh \
            scripts/sw-lib-daemon-gates-test.sh \
            scripts/sw-connect-test.sh \
            scripts/sw-fleet-test.sh \
            scripts/sw-fleet-discover-test.sh \
            scripts/sw-fleet-viz-test.sh \
            scripts/sw-self-optimize-test.sh \
            scripts/sw-lib-test-isolate-test.sh; do
            echo "::group::$suite"
            if ! bash "$suite"; then
              echo "::error::$suite failed under bash 3.2"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  # Budget-limited real-Claude smoke (~$0.25/PR); runs only when Claude secret is set
  integration-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for Claude credentials
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" && -z "$ANTHROPIC_API_KEY" ]]; then
            echo "No Claude credentials found — skipping integration test"
            echo "SKIP_CLAUDE=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SKIP_CLAUDE != 'true'

      - name: Install dependencies
        if: env.SKIP_CLAUDE != 'true'
        # bubblewrap + socat are the Claude CLI's sandbox dependencies. Without
        # them it prints "Sandbox disabled: … bwrap not installed, socat not
        # installed" and exits 1, which was this job's only failure once the
        # exit-code reporting bug was fixed (it previously claimed "exit 0").
        run: sudo apt-get update && sudo apt-get install -y tmux jq bubblewrap socat

      - name: Install Claude Code CLI
        if: env.SKIP_CLAUDE != 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.301

      - name: Snapshot the agent permission policy (#8614)
        if: env.SKIP_CLAUDE != 'true'
        # From the default branch, not the checkout: a PR cannot widen the policy its own agent runs under.
        # The copy is read-only and outside the agent's working tree; agent-exec refuses a policy in the tree in CI.
        run: scripts/ci/snapshot-agent-policy.sh

      - name: Install agent sandbox (bubblewrap, socat; AppArmor on Ubuntu 24.04) (#8614)
        if: env.SKIP_CLAUDE != 'true'
        run: scripts/ci/agent-sandbox-setup.sh

      - name: Run budget-limited Claude integration smoke
        if: env.SKIP_CLAUDE != 'true'
        # The CLI resolves ANTHROPIC_API_KEY *before* CLAUDE_CODE_OAUTH_TOKEN,
        # so exporting both lets a stale key shadow a working token — which is
        # exactly what happened here: the job failed "Invalid API key" while
        # claude-review, which uses the OAuth token directly, passed on the
        # same commit. Setting the key to '' does not help; an empty value
        # still wins its precedence slot and authenticates as an empty key. It
        # has to be genuinely unset, so prefer the OAuth token when both exist
        # and fall back to the key only when there is no token.
        run: |
          if [[ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            unset ANTHROPIC_API_KEY
          fi
          bash scripts/sw-integration-claude-test.sh

  # Validate integration-claude skip path when no secret (script must exit 0 and skip)
  integration-claude-skip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run integration-claude without secrets (expect skip)
        run: |
          out=$(bash scripts/sw-integration-claude-test.sh 2>&1) || exit 1
          echo "$out" | grep -q "Skipping integration-claude" || (echo "$out"; exit 1)
          echo "Skip path OK"

  dashboard-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # bun.lock is the only root lockfile (#8647); same pin as ts-check.yml.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dashboard tests with coverage
        run: bunx vitest run --config dashboard/vitest.config.ts --coverage

      - name: Check generated token CSS is current
        # Drift between dashboard/src/design/tokens.ts and the committed CSS (spec 8.1).
        run: bun tools/web/gen-tokens.ts --check

      - name: Dashboard bundle budget and no runtime CDN
        # Builds to a temp dir outside the repo and fails over budget (tools/web/budget.json).
        run: bun run web:budget

      - name: No external script, style or font loads
        run: bun run web:no-cdn

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ShellCheck
        # Pinned, not apt: whatever version the runner image ships drifts from
        # what developers run locally, and shellcheck changes its findings
        # between releases. apt's build reported SC2120 on functions that take
        # optional `${1:-default}` arguments; 0.11.0 correctly does not. That
        # skew is the classic "passes locally, fails only in CI".
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Lint scripts
        # Warning severity is enforced, minus three codes that are structural to
        # this codebase rather than defects:
        #   SC2034 — "appears unused": scripts define config vars that are read
        #            by other scripts after `source`, which shellcheck cannot see.
        #   SC1090 — "can't follow non-constant source": every lib load is
        #            "$SCRIPT_DIR/lib/x.sh" by design.
        #   SC2148 — "no shebang": lib files are sourced, never executed.
        #   SC2119/SC2120 — "references arguments, but none are ever passed":
        #            fires on functions with optional `${1:-default}` params,
        #            which is a deliberate pattern here (gen_agent_id,
        #            optimize_learn_risk_keywords). 0.11.0 no longer reports
        #            these; the codes stay excluded so an older shellcheck
        #            cannot resurrect them.
        # Everything else is a real finding and blocks. This gate had been failing
        # continuously since 2026-04-05 on 89 findings; the 15 genuine ones are
        # fixed (a real unbound-variable bug among them) and the gate now passes,
        # so it can actually block regressions instead of being ignored.
        run: |
          shellcheck -x -S warning -e SC2034,SC1090,SC2148,SC2119,SC2120 scripts/sw scripts/sw-*.sh install.sh
