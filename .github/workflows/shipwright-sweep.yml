name: Shipwright Sweep

# Cron sweep: finds pipelines that started but never posted a result and labels them
# shipwright-stuck. It never dispatches: shipwright-dispatch.yml (gated) starts new issues and
# shipwright-auto-retry.yml is the only retry path (ADR-0007).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Load sweep policy from config
        shell: bash
        run: |
          if [ -f config/policy.json ]; then
            echo "STUCK_THRESHOLD_HOURS=$(jq -r '.sweep.stuck_threshold_hours // 4' config/policy.json)" >> "$GITHUB_ENV"
          fi

      - name: Sweep shipwright issues
        id: find
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- Shipwright Sweep: $(date -u +%Y-%m-%dT%H:%M:%SZ) ---"
          STUCK_HOURS="${STUCK_THRESHOLD_HOURS:-4}"
          if [[ ! "$STUCK_HOURS" =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo "::error::stuck_threshold_hours must be a whole number of hours, got '$STUCK_HOURS'"
            exit 1
          fi

          if ! ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label shipwright --state open --limit 200 --json number --jq '.[].number'); then
            echo "::error::cannot list shipwright issues"
            exit 1
          fi

          if [[ -z "$ISSUES" ]]; then
            echo "No open shipwright-labeled issues found."
            echo "stuck=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found shipwright issues: $ISSUES"

          if ! STUCK_SINCE=$(date -u -d "${STUCK_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ); then
            echo "::error::cannot compute the stuck threshold"
            exit 1
          fi

          STUCK=""
          READ_FAILURES=0

          for issue in $ISSUES; do
            echo ""
            echo "--- Checking issue #$issue ---"

            # ── Skip issues with an active or queued run ──
            if ! ACTIVE=$(scripts/ci/pipeline-active.sh "$issue"); then
              echo "::error::cannot list pipeline runs for #$issue; leaving it alone"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi
            if [[ "$ACTIVE" == "true" ]]; then
              echo "Issue #$issue: pipeline running or queued — skipping"
              continue
            fi

            # Bot-authored comments only: anyone can type "Pipeline Starting" (ADR-0007).
            if ! COMMENTS_JSON=$(scripts/ci/bot-comments.sh "$issue"); then
              echo "::error::cannot read bot comments for #$issue; leaving it alone"
              READ_FAILURES=$((READ_FAILURES + 1))
              continue
            fi

            # ── Stuck: started before the threshold, no result since the last start ──
            LAST_START_DATE=$(jq -r '[.[] | select(.body | contains("Pipeline Starting")) | .createdAt] | last // ""' <<<"$COMMENTS_JSON")
            LAST_RESULT_DATE=$(jq -r '[.[] | select(.body | test("Pipeline Completed|Pipeline Failed")) | .createdAt] | last // ""' <<<"$COMMENTS_JSON")
            if [[ -n "$LAST_START_DATE" && ( -z "$LAST_RESULT_DATE" || "$LAST_RESULT_DATE" < "$LAST_START_DATE" ) \
              && "$LAST_START_DATE" < "$STUCK_SINCE" ]]; then
              echo "Issue #$issue: STUCK — started $LAST_START_DATE with no result"
              STUCK="${STUCK}${issue}"$'\n'
              continue
            fi

            echo "Issue #$issue: no action needed"
          done

          STUCK=$(grep -v '^$' <<<"$STUCK" || true)
          d="ghadelim_$(openssl rand -hex 8)"
          {
            echo "stuck<<$d"
            echo "$STUCK"
            echo "$d"
          } >> "$GITHUB_OUTPUT"

          echo ""
          echo "Stuck issues: ${STUCK:-none}"
          echo "Read failures: $READ_FAILURES"
          if [[ "$READ_FAILURES" -gt 0 ]]; then
            exit 1
          fi

      # Labels and comments only. shipwright-stuck holds the issue out of dispatch and auto-retry
      # until a human clears the label.
      - name: Label stuck issues
        if: always() && steps.find.outputs.stuck != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUCK_ISSUES: ${{ steps.find.outputs.stuck }}
        run: |
          FAILURES=0
          while read -r issue; do
            [[ -z "$issue" ]] && continue
            echo "Handling stuck issue #$issue..."

            if ! LABELS=$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]'); then
              echo "::error::cannot read labels for #$issue"
              FAILURES=$((FAILURES + 1))
              continue
            fi
            if jq -e 'index("shipwright-stuck")' <<<"$LABELS" >/dev/null; then
              echo "Issue #$issue: already labeled shipwright-stuck — skipping"
              continue
            fi

            if ! gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label "shipwright-stuck"; then
              echo "::error::cannot label #$issue shipwright-stuck"
              FAILURES=$((FAILURES + 1))
              continue
            fi

            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
          ⚠️ **Shipwright Sweep — Stuck Pipeline Detected**

          This issue has had a pipeline running for more than ${STUCK_THRESHOLD_HOURS:-4} hours with no completion result.
          It is labelled \`shipwright-stuck\`; nothing dispatches or retries it until a human removes that label.

          Possible causes:
          - Pipeline runner timed out or was cancelled without posting results
          - GitHub Actions outage during pipeline execution
          - Pipeline hung on a long-running stage

          To retry manually after investigating:
          \`\`\`
          gh workflow run shipwright-pipeline.yml -f issue_number=$issue -f template=full -f skip_triage=true
          \`\`\`
          EOF
          )" || echo "::warning::could not comment on #$issue (it is labelled)"
          done <<<"$STUCK_ISSUES"
          if [[ "$FAILURES" -gt 0 ]]; then
            exit 1
          fi
