# Review Remediation — When code review finds actionable issues, trigger agent to fix them.
# Part of the Code Factory pattern: review findings → patch → validate → push → rerun.
name: Review Remediation

on:
  # Triggered when review comments are posted
  pull_request_review:
    types: [submitted]
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to remediate"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: review-remediation-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  remediate:
    # Only run on reviews that request changes, or on manual dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine PR number
        id: pr
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
          fi
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::invalid PR number"; exit 1; }
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Get the PR branch and head SHA
          PR_JSON=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid,baseRefName)
          BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          # The base branch, recorded here (before the agent runs) for the rerun step to use.
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')
          git check-ref-format --branch "$BASE_REF" >/dev/null || { echo "::error::invalid base branch"; exit 1; }
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

          # headRefName is attacker-chosen. check-ref-format does NOT reject shell
          # metacharacters (`"`, `;`, `$`, `|` are all valid in ref names); it only
          # rejects malformed names (e.g. leading "-"). Safety comes from passing
          # BRANCH via env and always quoting it, never from this check.
          git check-ref-format --branch "$BRANCH" >/dev/null || { echo "::error::invalid branch"; exit 1; }

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Materialize trusted CI scripts from the base branch (#8673)
        # Before the PR branch is checked out. The policy snapshot, the sandbox setup and the agent launcher run from
        # this copy, never from the agent-authored branch: a PR cannot change the policy its own agent runs under.
        # Always the repository's DEFAULT branch, not the PR's base: a PR chooses its base, and an older branch would
        # be a downgrade. Fetched as a GitHub tarball, not a checkout or a remote.
        run: |
          TRUSTED="$RUNNER_TEMP/trusted"
          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null || { echo "::error::invalid default branch"; exit 1; }
          rm -rf "$TRUSTED"
          mkdir -p "$TRUSTED"
          gh api "repos/${GITHUB_REPOSITORY}/tarball/${DEFAULT_BRANCH}" > "$RUNNER_TEMP/trusted.tgz"
          tar -xzf "$RUNNER_TEMP/trusted.tgz" -C "$TRUSTED" --strip-components=1
          rm -f "$RUNNER_TEMP/trusted.tgz"
          chmod -R a-w "$TRUSTED"
          for f in scripts/ci/snapshot-agent-policy.sh scripts/ci/agent-sandbox-setup.sh scripts/lib/agent-exec.sh; do
            [[ -f "$TRUSTED/$f" ]] || { echo "::error::base branch has no $f"; exit 1; }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR branch
        # Branch name is untrusted: pass via env, never interpolate into the script.
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          git check-ref-format --branch "$BRANCH" >/dev/null || { echo "::error::invalid branch"; exit 1; }
          git checkout "$BRANCH"

      - name: Collect review findings
        id: findings
        run: |
          # Collect review comments from the latest review
          REVIEW_COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | last | .body // ""' 2>/dev/null || echo "")

          # Also get inline review comments
          INLINE_COMMENTS=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" \
            --jq '[.[] | select(.commit_id == "'"${HEAD_SHA}"'")] | map({path: .path, line: .line, body: .body}) | tostring' 2>/dev/null || echo "[]")

          # Build remediation context
          cat > /tmp/review-findings.json << EOF
          {
            "pr_number": ${PR_NUMBER},
            "head_sha": "${HEAD_SHA}",
            "review_body": $(echo "$REVIEW_COMMENTS" | jq -Rs .),
            "inline_comments": ${INLINE_COMMENTS:-[]}
          }
          EOF

          FINDING_COUNT=$(echo "$INLINE_COMMENTS" | jq 'length' 2>/dev/null || echo "0")
          echo "count=$FINDING_COUNT" >> "$GITHUB_OUTPUT"
          echo "has_findings=$([[ "$FINDING_COUNT" -gt 0 || -n "$REVIEW_COMMENTS" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}

      - name: Snapshot the agent permission policy (#8614)
        # From the default branch, not the checkout: a PR cannot widen the policy its own agent runs under.
        # The copy is read-only and outside the agent's working tree; agent-exec refuses a policy in the tree in CI.
        # The script itself comes from the base branch copy (#8673), not the PR checkout.
        run: bash "$RUNNER_TEMP/trusted/scripts/ci/snapshot-agent-policy.sh"

      - name: Install agent sandbox (bubblewrap, socat; AppArmor on Ubuntu 24.04) (#8614)
        # Agents refuse to start without the sandbox (sandbox.failIfUnavailable). This step fails the job
        # with the fix if the runner cannot sandbox, instead of agents failing later as "auth" errors.
        run: bash "$RUNNER_TEMP/trusted/scripts/ci/agent-sandbox-setup.sh"

      - name: Remediate with Claude
        if: steps.findings.outputs.has_findings == 'true'
        run: |
          # Guard: skip if no auth token
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN not set — skipping remediation"
            exit 0
          fi

          # Install Claude Code at a pinned version if needed (#8583). No `|| true`: a failed install
          # fails the step instead of running remediation without the CLI.
          if ! command -v claude &>/dev/null; then
            npm install -g @anthropic-ai/claude-code@2.1.301
          fi

          FINDINGS=$(cat /tmp/review-findings.json)

          PROMPT="You are remediating code review findings on PR #${PR_NUMBER}.

          ## Review Findings
          ${FINDINGS}

          ## Instructions
          1. Read each review finding carefully
          2. Make the minimum necessary code changes to address each finding
          3. Run relevant tests to validate your changes
          4. Do NOT introduce new features or refactor unrelated code
          5. Focus only on what the reviewer requested

          Fix all actionable findings. Skip any that are questions or suggestions without clear action items."

          # Through agent-exec.sh from the base branch copy (#8673): the agent gets no GitHub token (F9).
          # The model alias comes from the trusted default-branch copy, never the PR checkout (W2-07). Until
          # config/models.json is on the default branch (merge order: W2-07 lands after #8675 and then the
          # file exists), the pinned sonnet ID is used with a warning, so remediation does not hard-fail.
          MODELS_FILE="$RUNNER_TEMP/trusted/config/models.json"
          if [[ -f "$MODELS_FILE" ]]; then
            REMEDIATION_MODEL="$(jq -r '.aliases.sonnet // empty' "$MODELS_FILE")"
          else
            echo "::warning::config/models.json is not on the default branch yet; using the pinned sonnet ID"
            REMEDIATION_MODEL="claude-sonnet-5-5"
          fi
          [[ -n "$REMEDIATION_MODEL" && "$REMEDIATION_MODEL" != "null" ]] || { echo "::error::no sonnet alias in config/models.json"; exit 1; }
          "$RUNNER_TEMP/trusted/scripts/lib/agent-exec.sh" claude -p "$PROMPT" --max-turns 10 --model "$REMEDIATION_MODEL" 2>&1 || {
            echo "::warning::Claude remediation returned non-zero — changes may be partial"
          }
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}

      - name: Run validation
        if: steps.findings.outputs.has_findings == 'true'
        run: |
          # Run the test suite to validate remediation
          if [[ -f "package.json" ]]; then
            npm test 2>&1 || {
              echo "::warning::Tests failed after remediation"
              exit 1
            }
          fi

      - name: Push remediation commit
        if: steps.findings.outputs.has_findings == 'true'
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit — review findings may not have been actionable"
            exit 0
          fi

          git config user.name "shipwright[bot]"
          git config user.email "shipwright[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: address review findings for ${SHORT_SHA}

          Automated remediation by Shipwright Code Factory.
          Findings: ${FINDING_COUNT} inline comments addressed.
          Original head: ${HEAD_SHA}"

          git check-ref-format --branch "$BRANCH" >/dev/null || { echo "::error::invalid branch"; exit 1; }
          git push origin "$BRANCH"

          echo "Remediation commit pushed — PR synchronize will trigger rerun path"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Step outputs passed via env so they are data, not shell code.
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          FINDING_COUNT: ${{ steps.findings.outputs.count }}
          # The push authenticates per command from GH_TOKEN through the inline credential helper at KEY_2
          # (the checkout persists no token). KEY_0 and KEY_1 reset the accumulating credential.helper list
          # (global, then github.com-scoped) before KEY_2 adds the helper, so a helper the agent adds to
          # .git/config gets no token; KEY_3/KEY_4 disable repo hooks and fsmonitor. Same helper text as the
          # pipeline workflow.
          GIT_CONFIG_COUNT: "5"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://github.com.helper
          GIT_CONFIG_VALUE_1: ''
          GIT_CONFIG_KEY_2: credential.helper
          GIT_CONFIG_VALUE_2: '!f() { test "$1" = get || exit 0; proto=; host=; while IFS= read -r l && [ -n "$l" ]; do case "$l" in protocol=*) proto=${l#protocol=};; host=*) host=${l#host=};; esac; done; t=${GITHUB_TOKEN:-$GH_TOKEN}; if [ "$proto" = https ] && [ "$host" = github.com ] && [ -n "$t" ]; then printf "username=x-access-token\npassword=%s\n" "$t"; fi; }; f'
          GIT_CONFIG_KEY_3: core.hooksPath
          GIT_CONFIG_VALUE_3: /dev/null
          GIT_CONFIG_KEY_4: core.fsmonitor
          GIT_CONFIG_VALUE_4: "false"

      - name: Request review rerun
        if: steps.findings.outputs.has_findings == 'true'
        run: |
          # This step holds GH_TOKEN, so it never runs PR-head code. The rerun writer comes from scripts/ of
          # the PR's BASE branch, fetched as a GitHub tarball: not the agent-edited working tree, not a git
          # remote (the agent could repoint one), and not the PR head (a PR could change the writer or its lib/).
          NEW_HEAD=$(git rev-parse HEAD)
          git check-ref-format --branch "$BASE_REF" >/dev/null || { echo "::error::invalid base branch"; exit 1; }
          PRISTINE="$RUNNER_TEMP/pristine"
          BASE_TREE="$RUNNER_TEMP/base-tree"
          rm -rf "$PRISTINE" "$BASE_TREE"
          mkdir -p "$PRISTINE" "$BASE_TREE"
          gh api "repos/${GITHUB_REPOSITORY}/tarball/${BASE_REF}" > "$RUNNER_TEMP/base.tgz"
          tar -xzf "$RUNNER_TEMP/base.tgz" -C "$BASE_TREE" --strip-components=1
          cp -R "$BASE_TREE/scripts" "$PRISTINE/"
          if [[ -f "$PRISTINE/scripts/sw-review-rerun.sh" ]]; then
            bash "$PRISTINE/scripts/sw-review-rerun.sh" request "$PR_NUMBER" "$NEW_HEAD" "shipwright" || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          # Recorded by the PR-number step before the agent ran; passed via env, never interpolated.
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
