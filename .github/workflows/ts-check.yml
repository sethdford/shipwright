name: TypeScript check

# Mirrors `bun run check` stage by stage so a failure names the stage that broke
# (except `dashboard:test`, which test.yml runs).
# If you change the `check` script in package.json, change this list too.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the baseline check below needs the merge base
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.19
      - name: Install system tools used by parity suites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq tmux
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format (Biome)
        run: bun run lint
      - name: Fitness rules (F1–F12, workflow rules)
        run: bun run arch
      - name: Fitness baselines never grow against the base branch
        if: github.event_name == 'pull_request'
        run: |
          bun tools/arch/ast-scan.ts --against "origin/$GITHUB_BASE_REF"
          bun tools/arch/size-ratchet.ts --against "origin/$GITHUB_BASE_REF"
      - name: Unit, application and contract tests
        run: bun test ./src ./tools
      - name: Failure-classifier fuzz, TS vs bash (1786 rows; one locale on PRs, both on main)
        # ~90 s per locale. The per-run unit test checks a fixed sample in both locales (#8715).
        env:
          FUZZ_LOCALE: ${{ github.event_name == 'push' && 'all' || 'C' }}
        run: bun src/testing/fixtures/wave2/classify-fuzz.ts --locale "$FUZZ_LOCALE"
      - name: Generated CLI reference is current
        run: bun run docs:check
      - name: Router points at TypeScript only for parity-green commands
        run: bun run port:check
      - name: Parity suites for ported commands
        run: bun run parity
