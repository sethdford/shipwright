name: Shipwright safety gates
description: >-
  Installs the Shipwright TypeScript CLI and runs `shipwright gates check` (pause, breaker,
  budget, review WIP, fix loop; ADR-0007). Fails the step, and so the job, unless every gate
  allows dispatch: a closed gate, an unreadable source, a usage error or a missing Bun all stop
  the job. Output `allowed` is 'true' only on success. Requires actions/checkout first and
  GH_REPO in the job env. The token is an input and reaches only the gate check (as GH_TOKEN),
  not the dependency install.
inputs:
  retry:
    description: >-
      The retry number about to be dispatched: 0 for a first dispatch, N for the Nth retry.
      Required with no default, because an unknown count must not read as a first dispatch.
    required: true
  github-token:
    description: Token for the gate check's gh calls (pass secrets.GITHUB_TOKEN). Reads, plus opening the incident issue when the breaker trips.
    required: true
  on-refusal:
    description: >-
      'fail' (default) fails the step on any closed gate. 'notice' turns a refusal (exit 1) into a
      ::notice:: and a successful step with `allowed` unset, so the caller can end its run without a
      failure. Every other exit (2, 127, a signal) still fails the step, and any value other than
      'notice' behaves as 'fail'. Only the labeled entry point uses 'notice': its runs are not in the
      breaker's history (ADR-0007).
    required: false
    default: fail
outputs:
  allowed:
    description: "'true' when every gate allows dispatch (the step fails otherwise)"
    value: ${{ steps.gates.outputs.allowed }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.2.19
    - name: Install the Shipwright CLI dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Check the dispatch gates
      id: gates
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RETRY: ${{ inputs.retry }}
        ON_REFUSAL: ${{ inputs.on-refusal }}
      run: |
        # Exit 0 is the only "allowed"; 1 (blocked or unverifiable), 2 (usage), 127 or a signal
        # all stop the job by default. The report goes to the log.
        # The JSON report is the same run's output, so notice mode can tell a refusal from an outage.
        if REPORT=$(bun src/cli.ts gates check --retry "$RETRY" --json); then
          # The report is printed on success too: the per-gate verdicts and the budget no-data warning
          # (warning: true) stay in the log.
          printf '%s\n' "$REPORT"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
        else
          rc=$?
          printf '%s\n' "$REPORT"
          # A refusal is exit 1 with allowed false, at least one gate blocked, and no gate that could
          # not be verified (verdict error: an outage, a bad token, an unreadable source). Anything
          # else, including unparseable output, fails the step.
          if [[ "$ON_REFUSAL" == "notice" && "$rc" -eq 1 ]] && jq -e '
              .allowed == false
              and any(.gates[]?; .verdict == "blocked")
              and (any(.gates[]?; .verdict == "error") | not)' <<<"$REPORT" >/dev/null; then
            echo "::notice::Shipwright safety gates refused dispatch; nothing dispatched"
            exit 0
          fi
          echo "::error::Shipwright safety gates did not allow dispatch (exit $rc); nothing dispatched"
          exit 1
        fi
